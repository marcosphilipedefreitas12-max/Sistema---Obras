<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --grafite: #22272b; --grafite2: #2d3439; --grafite3: #3a434a;
    --fundo: #eceeec; --papel: #ffffff; --tinta: #1b2025; --aco: #5d6873; --linha: #d6dadc; --linha2: #e8ebec;
    --azul: #1f3864; --azul2: #2b4a80; --sinal: #f2b705;
    --verm: #b42318; --verm-f: #fdecea; --verde: #2f7d32; --verde-f: #e7f3e8; --ambar: #9a5b00; --ambar-f: #fff3d6; --azul-f: #e7ecf6;
    --titulo: "Barlow Condensed", "Arial Narrow", sans-serif; --texto: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    --campo: #ffffff; --campo-b: #c4cacf; --cab: #f4f5f6; --hover: #f7f8fa; --st: #eef0f2; --st-t: #3d464d; --coluna: #e2e5e4; --azul-t: #1f3864;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s0: #c3c9ce; --grade: #e8ebec;
    color-scheme: light;
  }
  :root[data-tema="escuro"] {
    --grafite: #101316; --grafite2: #1b2024; --grafite3: #2a3136;
    --fundo: #15191c; --papel: #1f2428; --tinta: #e6e9eb; --aco: #a3adb5; --linha: #353d43; --linha2: #2a3136;
    --azul: #3a68b0; --azul2: #4a7cc4; --azul-t: #8fb4ec; --azul-f: #1f2c42;
    --verm: #f07167; --verm-f: #3a1f1d; --verde: #6cc070; --verde-f: #1d3320; --ambar: #e0a43a; --ambar-f: #3a2d12;
    --campo: #171b1e; --campo-b: #424b52; --cab: #262c31; --hover: #262c31; --st: #2c3338; --st-t: #d3d8dc; --coluna: #191d20;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s0: #59636b; --grade: #2c3338;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--texto); font-size: 14px; color: var(--tinta); background: var(--fundo); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sinal); outline-offset: 1px; }
  .app { display: grid; grid-template-columns: 252px 1fr; min-height: 100%; }

  .lado { background: var(--grafite); color: #c9d0d5; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .marca { padding: 18px 18px 14px; border-bottom: 1px solid var(--grafite3); }
  .marca b { font-family: var(--titulo); font-size: 22px; font-weight: 700; color: #fff; letter-spacing: .3px; display: block; }
  .marca span { font-size: 12px; color: #9aa5ad; }
  .busca { margin: 12px 14px 4px; }
  .busca input { width: 100%; background: var(--grafite2); border: 1px solid var(--grafite3); border-radius: 6px; padding: 7px 10px; color: #fff; }
  .busca input::placeholder { color: #87929a; }
  .grupo { padding: 10px 0 2px; }
  .grupo > div { font-size: 12px; color: #87929a; padding: 4px 18px; }
  .lado a { display: flex; align-items: center; gap: 8px; padding: 7px 18px 7px 15px; color: #d6dce0; text-decoration: none; border-left: 3px solid transparent; cursor: pointer; font-size: 13.5px; }
  .lado a:hover { background: var(--grafite2); }
  .lado a.on { border-left-color: var(--sinal); background: var(--grafite2); color: #fff; font-weight: 500; }
  .lado a .ct { margin-left: auto; font-size: 11px; background: var(--verm); color: #fff; border-radius: 9px; padding: 0 6px; }
  .lado .rodape { margin-top: auto; padding: 14px 18px; font-size: 12px; color: #87929a; border-top: 1px solid var(--grafite3); }
  .lado .rodape a { padding: 0; border: 0; display: inline; color: #c9d0d5; text-decoration: underline; }

  .topo-mob { display: none; }
  .carimbo .cel div.usu { position: relative; padding-right: 44px; }
  .bt-tema { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--linha); background: var(--cab); cursor: pointer; font-size: 15px; line-height: 1; }
  .bt-tema:hover { border-color: var(--azul2); } .bt-tema:focus-visible { outline: 3px solid var(--sinal); }
  .sel-tema { display: inline-flex; margin-top: 10px; border: 1px solid var(--grafite3); border-radius: 6px; overflow: hidden; }
  .sel-tema button { background: none; border: 0; color: #c9d0d5; padding: 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .sel-tema button + button { border-left: 1px solid var(--grafite3); }
  .sel-tema button.on { background: var(--sinal); color: #22272b; font-weight: 600; }
  .sel-tema button:focus-visible { outline: 2px solid var(--sinal); outline-offset: -2px; }
  .tema { background: none; border: 1px solid var(--grafite3); color: #c9d0d5; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12px; margin-top: 8px; }
  .somente-leitura .so-grava { display: none !important; }
  .somente-leitura .seg { pointer-events: none; opacity: .75; }
  .perfil-tag { display: inline-block; margin-top: 6px; font-size: 11px; border: 1px solid var(--grafite3); border-radius: 3px; padding: 1px 6px; color: #c9d0d5; }
  /* painel do Início */
  .graficos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
  .graf { background: var(--papel); border: 1px solid var(--linha); padding: 14px 16px 12px; min-width: 0; position: relative; }
  .graf.largo { grid-column: span 2; }
  .graf h3 { font-family: var(--titulo); font-size: 19px; font-weight: 600; margin: 0 0 2px; }
  .graf .sub { font-size: 12px; color: var(--aco); margin: 0 0 10px; }
  .graf .grande { font-family: var(--titulo); font-size: 34px; font-weight: 700; line-height: 1.05; }
  .graf svg { display: block; width: 100%; height: auto; overflow: visible; }
  .graf svg text { fill: var(--aco); font-size: 11px; font-family: var(--texto); }
  .graf svg .val { fill: var(--tinta); font-weight: 600; }
  .graf .hit { fill: transparent; cursor: default; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--aco); margin-top: 8px; }
  .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legenda b { color: var(--tinta); font-weight: 600; margin-left: 4px; }
  .barra-h { margin: 8px 0 4px; }
  .barra-h .rot { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
  .barra-h .rot b { font-weight: 600; }
  .barra-h .trilho { height: 12px; background: var(--grade); border-radius: 0 4px 4px 0; }
  .barra-h .trilho div { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .selo { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 3px; margin-top: 10px; }
  .selo.ok { background: var(--verde-f); color: var(--verde); } .selo.at { background: var(--ambar-f); color: var(--ambar); } .selo.ruim { background: var(--verm-f); color: var(--verm); }
  .graf .vazio-g { color: var(--aco); font-size: 13px; padding: 26px 0; text-align: center; }
  .dica { position: fixed; pointer-events: none; background: var(--tinta); color: var(--fundo); font-size: 12px; padding: 6px 9px; border-radius: 4px; z-index: 70; display: none; white-space: nowrap; }
  .perfis td select { min-width: 150px; }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .fotos .foto { display: block; aspect-ratio: 1; background: var(--cab); border: 1px solid var(--linha); overflow: hidden; }
  .fotos .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fotos .foto span { display: block; padding: 6px; font-size: 11px; color: var(--aco); word-break: break-all; }
  .fotos .info { grid-column: 1 / -1; }
  @media (max-width: 1100px) { .graficos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .graficos { grid-template-columns: 1fr; } .graf.largo { grid-column: auto; } }
  .app.sem-lado { grid-template-columns: 1fr; } .app.sem-lado .lado, .app.sem-lado .topo-mob button[onclick="menuMob()"] { display: none; }
  .obras { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .obra { background: var(--papel); border: 1px solid var(--linha); border-top: 4px solid var(--azul); display: flex; flex-direction: column; }
  .obra .abre { all: unset; cursor: pointer; padding: 16px 16px 12px; display: block; }
  .obra .abre:focus-visible { outline: 3px solid var(--sinal); }
  .obra .abre b { font-family: var(--titulo); font-size: 22px; font-weight: 600; display: block; color: var(--azul-t); }
  .obra .abre span { font-size: 12.5px; color: var(--aco); }
  .obra .abre:hover b { text-decoration: underline; }
  .obra .acoes { border-top: 1px solid var(--linha2); padding: 8px 16px; display: flex; gap: 16px; font-size: 12.5px; }
  .obra .acoes a { color: var(--aco); cursor: pointer; text-decoration: underline; }
  main { padding: 22px 28px 60px; min-width: 0; }
  .carimbo { display: grid; grid-template-columns: 1fr auto; border: 1.5px solid var(--tinta); background: var(--papel); margin-bottom: 20px; }
  .carimbo .tit { padding: 14px 18px; border-right: 1.5px solid var(--tinta); }
  .carimbo h1 { font-family: var(--titulo); font-weight: 700; font-size: 32px; line-height: 1; margin: 0 0 6px; letter-spacing: .2px; }
  .carimbo p { margin: 0; color: var(--aco); max-width: 70ch; }
  .carimbo .cel { display: grid; grid-template-columns: repeat(2, minmax(120px, auto)); }
  .carimbo .cel div { padding: 7px 12px; border-bottom: 1px solid var(--linha); border-left: 1px solid var(--linha); font-size: 13px; }
  .carimbo .cel div:nth-child(odd) { border-left: 0; }
  .carimbo .cel div:nth-last-child(-n+2) { border-bottom: 0; }
  .carimbo .cel small { display: block; font-size: 11px; color: var(--aco); }
  .corpo { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
  .corpo.sem-guia { grid-template-columns: minmax(0, 1fr); }
  .corpo.cheia { grid-template-columns: minmax(0, 1fr); } .corpo.cheia .guia { order: 2; }
  .guia { background: var(--papel); border-top: 4px solid var(--sinal); padding: 14px 16px; position: sticky; top: 16px; font-size: 13px; }
  .guia h2 { font-family: var(--titulo); font-size: 20px; margin: 0; font-weight: 600; display: inline; }
  .guia summary { cursor: pointer; margin-bottom: 8px; list-style-position: outside; }
  .guia:not([open]) summary { margin-bottom: 0; }
  .guia .qd { color: var(--aco); margin: 0 0 10px; }
  .guia ol { margin: 0; padding-left: 20px; }
  .guia li { margin-bottom: 7px; }
  .guia .leg { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--linha2); color: var(--aco); font-size: 12px; }
  .barra { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .barra .esp { flex: 1; }
  .barra input[type=search] { width: 260px; max-width: 100%; }
  .btn { border: 1px solid var(--azul); background: var(--azul); color: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--azul2); }
  .btn.sec { background: var(--papel); color: var(--azul-t); border-color: var(--linha); }
  .btn.sec:hover { border-color: var(--azul); }
  .btn.perigo { background: var(--papel); color: var(--verm); border-color: var(--linha); }
  .btn.peq { padding: 4px 9px; font-size: 12px; }
  input, select, textarea { border: 1px solid var(--campo-b); border-radius: 6px; padding: 8px 10px; background: var(--campo); width: 100%; }
  textarea { min-height: 76px; resize: vertical; }
  .info { color: var(--aco); font-size: 12px; }

  .tabela { background: var(--papel); border: 1px solid var(--linha); overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; background: var(--cab); text-align: left; font-weight: 600; font-size: 12px; color: var(--aco); padding: 8px 10px; border-bottom: 1.5px solid var(--tinta); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--linha2); vertical-align: top; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--hover); }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mais { padding: 10px; text-align: center; }
  .vazio { background: var(--papel); border: 1px dashed #b9c0c5; padding: 28px; text-align: center; color: var(--aco); }
  .vazio b { display: block; color: var(--tinta); font-size: 15px; margin-bottom: 6px; }
  .st { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: var(--st); color: var(--st-t); white-space: nowrap; }
  .st.verm { background: var(--verm-f); color: var(--verm); } .st.verde { background: var(--verde-f); color: var(--verde); }
  .st.ambar { background: var(--ambar-f); color: var(--ambar); } .st.azul { background: var(--azul-f); color: var(--azul); }

  .fundo-gaveta { position: fixed; inset: 0; background: rgba(27,32,37,.42); display: none; z-index: 40; }
  .gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--papel); z-index: 41; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; visibility: hidden; }
  .aberta .fundo-gaveta { display: block; } .aberta .gaveta { transform: none; visibility: visible; }
  .gaveta header { padding: 16px 20px; border-bottom: 1.5px solid var(--tinta); }
  .gaveta header h2 { font-family: var(--titulo); font-size: 26px; margin: 0; font-weight: 700; }
  .gaveta header .info { margin-top: 3px; }
  .gaveta .conteudo { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .gaveta footer { padding: 12px 20px; border-top: 1px solid var(--linha); display: flex; gap: 8px; align-items: center; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; }
  .campo .aj { font-size: 12px; color: var(--aco); margin-top: 4px; line-height: 1.4; }
  .secao { font-family: var(--titulo); font-size: 18px; font-weight: 600; margin: 20px 0 10px; padding-top: 12px; border-top: 1px solid var(--linha); }
  .secao small { font-family: var(--texto); font-size: 12px; font-weight: 400; color: var(--aco); display: block; }
  .auto { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  .auto span:nth-child(odd) { color: var(--aco); } .auto span:nth-child(even) { text-align: right; font-weight: 500; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  .fich-est { margin: 0 0 10px; border-left: 3px solid var(--linha2); padding: 2px 0 2px 10px; }
  .fich-est summary { cursor: pointer; padding: 4px 0; }
  .est-tab { border-collapse: collapse; width: 100%; max-width: 560px; margin: 6px 0; font-size: 13px; }
  .est-tab td { padding: 4px 6px; border-bottom: 1px solid var(--linha2); } .est-tab td.num { text-align: right; white-space: nowrap; }
  .est-tab tr.tot td { border-top: 2px solid var(--tinta); } .est-tab tr.sub td { color: var(--aco); }
  .est-cfg { gap: 10px 16px; flex-wrap: wrap; } .est-cfg input[type=checkbox] { width: auto; min-height: 0; } .est-cfg label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .faixa.dinheiro b { font-size: 24px; }
  .fich-pres { margin: 2px 0 10px; } .fich-pres .ruim { color: var(--verm); }
  .fich-pags { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--linha2); }
  .fich-pag { padding: 8px 10px 8px 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .fich-pag + .fich-pag { padding-left: 10px; border-left: 1px solid var(--linha2); }
  .fich-pag > small { color: var(--aco); font-size: 12px; }
  .fich-lin b { font-family: var(--titulo); font-size: 18px; } .fich-lin .diar-bt { margin-top: 4px; }
  .fich-mais { font-size: 12.5px; cursor: pointer; color: var(--azul-t); text-decoration: underline; }
  .diar { border: 1px solid var(--linha); background: var(--papel); padding: 12px 14px; margin-bottom: 10px; }
.diar-cab { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.diar-cab h3 { margin: 0; font-family: var(--titulo); font-size: 20px; }
.diar-bt { display: flex; gap: 6px; flex-wrap: wrap; }
.diar .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.diar .tabela { margin-top: 10px; }
.diar-conta { padding: 10px 12px; border-left: 3px solid var(--sinal); background: var(--fundo); margin: 4px 0 12px; }
.diar-conta .info { display: block; margin-top: 4px; }
.diar-outras { margin-top: 14px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.faixa { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--linha); background: var(--papel); margin-bottom: 12px; }
  .faixa div { padding: 14px 16px; border-left: 1px solid var(--linha); }
  .faixa div:first-child { border-left: 0; }
  .faixa b { display: block; font-family: var(--titulo); font-size: 30px; font-weight: 600; line-height: 1.05; }
  .faixa span { color: var(--aco); font-size: 12px; }
  .bloco h2 { font-family: var(--titulo); font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  .pend { background: var(--papel); border: 1px solid var(--linha); }
  .pend a { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--linha2); color: inherit; text-decoration: none; cursor: pointer; }
  .pend a:last-child { border-bottom: 0; }
  .pend a:hover { background: var(--hover); }
  .pend .q { margin-left: auto; min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 3px; background: var(--verde-f); color: var(--verde); }
  .pend .q.alto { background: var(--verm-f); color: var(--verm); }
  .atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .duas-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; margin-top: 10px; }

  .quadro { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; }
  .coluna { background: var(--coluna); padding: 10px; min-height: 240px; }
  .coluna h3 { margin: 0 0 10px; font-family: var(--titulo); font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; }
  .cartao { background: var(--papel); padding: 10px 11px; margin-bottom: 8px; border-left: 4px solid #98a2b3; cursor: pointer; }
  .cartao.Alta { border-left-color: var(--verm); } .cartao.Média { border-left-color: var(--sinal); }
  .cartao .t { font-weight: 600; margin-bottom: 6px; }
  .cartao .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--aco); }
  .cartao .mv { display: flex; gap: 6px; margin-top: 8px; }

  .nota { color: #b07800; letter-spacing: 1px; }
  .abas { display: flex; border-bottom: 1.5px solid var(--tinta); margin: -4px 0 14px; }
  .abas button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--aco); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
  .abas button.on { color: var(--tinta); border-bottom-color: var(--sinal); font-weight: 600; }
  .hist { white-space: pre-line; font-size: 12px; color: var(--aco); background: var(--cab); padding: 10px; max-height: 150px; overflow: auto; }

  .pres td { vertical-align: middle; }
  .seg { display: inline-flex; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-left: 1px solid var(--linha); background: var(--campo); padding: 7px 13px; cursor: pointer; font-weight: 600; min-width: 40px; }
  .seg button:first-child { border-left: 0; }
  .seg button.on.P { background: var(--verde); color: #fff; } .seg button.on.F { background: var(--verm); color: #fff; }
  .seg button.on.m { background: var(--sinal); color: #22272b; }

    .topo-mob { display: flex; align-items: center; gap: 10px; background: var(--grafite); color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 30; }

<body>
<div class="app" id="app">
  <aside class="lado" id="lado"></aside>
  <div>
    <div class="topo-mob"><button onclick="menuMob()" aria-label="Abrir menu">☰ Menu</button><b>Sistema de Obras</b><button class="tema-mob" style="margin-left:auto" onclick="trocarTema()" aria-label="Trocar tema claro/escuro" id="temaMob">☾ Escuro</button></div>
    <main id="main"><div class="vazio"><b>Abrindo a planilha da obra…</b>Isso leva alguns segundos na primeira vez.</div></main>
  </div>
</div>
<div class="fundo-gaveta" onclick="fecharGaveta()"></div>

<script>
var OBRA = '', OBRAS = null, D = null, CFG = null, ATUAL = 'inicio', CACHE = {}, BUSCA = {}, LIMITE = {}, FILTRO = { resp: '', fTipo: '' }, ABA_F = 'dados', PRES = null;
var ORIGENS = ['Chefe / diretoria', 'Projetista', 'Cliente', 'Vizinho', 'Fornecedor', 'Órgão público', 'Equipe da obra', 'Outro'];
var TIPOS_FORN = ['Fornecedor', 'Empreiteiro / prestador', 'Projetista', 'Órgão / concessionária', 'Locadora'];
var TIPOS_INT = ['Ligação', 'WhatsApp', 'E-mail', 'Visita', 'Reunião', 'Cotação', 'Cobrança', 'Outro'];
var PEND_MOD = [['boleto', 'lancamentos'], ['financeiro', 'lancamentos'], ['diário', 'diario'], ['presença', 'presenca'], ['planejamento', 'planejamento'],
  ['compras', 'compras'], ['cotaç', 'cotacoes'], ['mediç', 'medicoes'], ['equipamento', 'equipamentos'], ['inspeç', 'inspecoes'], ['fvs', 'fvs'],
  ['apartamento', 'vaptos'], ['loja', 'vlojas'], ['cronograma', 'cronograma'], ['estrutura', 'estrutura'], ['vizinho', 'monitoramento'], ['orçamento', 'analitico']];

/* ---------------------------------------------------------------- tema claro / escuro */
var PM = { grava: true, apaga: true, custos: true, admin: false, perfil: '', modulos: null };
function temaSalvo() { try { return localStorage.getItem('sis-tema'); } catch (e) { return null; } }
function aplicarTema(t) { document.documentElement.setAttribute('data-tema', t); var b = document.getElementById('temaMob'); if (b) b.textContent = t === 'escuro' ? '☀ Claro' : '☾ Escuro'; }
function seletorTema() {
  var e = document.documentElement.getAttribute('data-tema') === 'escuro';
  return '<div class="sel-tema" role="group" aria-label="Tema da tela"><button class="' + (e ? '' : 'on') + '" aria-pressed="' + !e + '" onclick="trocarTema(\'claro\')">☀ Claro</button>' +
    '<button class="' + (e ? 'on' : '') + '" aria-pressed="' + e + '" onclick="trocarTema(\'escuro\')">☾ Escuro</button></div>';
}
function botaoTema() {
  var e = document.documentElement.getAttribute('data-tema') === 'escuro';
  return '<button class="bt-tema" onclick="trocarTema()" title="' + (e ? 'Mudar para o tema claro' : 'Mudar para o tema escuro') + '" aria-label="' + (e ? 'Mudar para o tema claro' : 'Mudar para o tema escuro') + '">' + (e ? '☀️' : '🌙') + '</button>';
}
function trocarTema(qual) {
  var t = qual || (document.documentElement.getAttribute('data-tema') === 'escuro' ? 'claro' : 'escuro');
  aplicarTema(t); try { localStorage.setItem('sis-tema', t); } catch (e) {}
  Array.prototype.forEach.call(document.querySelectorAll('.bt-tema'), function (b) { b.outerHTML = botaoTema(); });
  if (D && el('app') && !el('app').classList.contains('sem-lado') && ATUAL === 'inicio') vInicio(); // gráficos redesenham com as cores do tema
}
aplicarTema(temaSalvo() || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'));

/* ---------------------------------------------------------------- servidor */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, erro) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro).sisChamar(OBRA, fn, args);
    } else if (window.SIS_MOCK) setTimeout(function () { try { ok(window.SIS_MOCK(fn, args)); } catch (e) { erro(e); } }, 120);
    else erro(new Error('Abra o sistema pelo link do Google (Apps Script).'));

}
function ocupado(on) { el('carregando').style.display = on ? 'block' : 'none'; }
function chamar() {
  ocupado(true);
  return api.apply(null, arguments).then(function (r) { ocupado(false); return r; }, function (e) { ocupado(false); aviso('Não foi possível concluir: ' + (e && e.message ? e.message : e), 7000); throw e; });
}

/* ---------------------------------------------------------------- utilidades */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function aviso(t, ms) { var x = el('aviso'); x.textContent = t; x.style.display = 'block'; clearTimeout(aviso.h); aviso.h = setTimeout(function () { x.style.display = 'none'; }, ms || 2600); }
function hoje() { return D ? D.hoje : new Date().toISOString().slice(0, 10); }
function dias(iso) { if (!iso) return null; return Math.round((new Date(String(iso).slice(0, 10) + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5); }
function br(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function brCurta(iso) { var b = br(iso); return b.length === 10 ? b.slice(0, 6) + b.slice(8) : b; }
function rs(v) { return v == null || v === '' ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); }
function chave(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function opts(lista, sel, vazio) { return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + lista.map(function (o) { return '<option' + (String(o) === String(sel) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
function mod(id) { return CFG.modulos.filter(function (m) { return m.id === id; })[0]; }
function manterFoco(sel) { setTimeout(function () { var x = document.querySelector(sel); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }); }
function prazoTag(iso, feito) {
  if (!iso) return '';
  var d = dias(iso);
  if (feito) return '<span class="st">' + brCurta(iso) + '</span>';
  if (d < 0) return '<span class="st verm">atrasada ' + (-d) + ' d</span>';
  if (d === 0) return '<span class="st ambar">vence hoje</span>';
  if (d <= 3) return '<span class="st ambar">' + brCurta(iso) + '</span>';
  return '<span class="st">' + brCurta(iso) + '</span>';
}
function stTag(t) {
  var s = chave(t); if (!s) return '';
  var c = /atras|vencid|reprov|crític|urg|não conform|^nc$|pendência venc|alerta|desligado|não contratar/.test(s) ? 'verm' :
          /aberto|aguard|pendênc|em vistoria|incomplet|atenção|a pagar|pedir|andamento/.test(s) ? 'ambar' :
          /aprov|liberad|conclu|pago|^ok|entreg|fechad|fechou|^ativo|corrigid|^c$|^s$|no prazo/.test(s) ? 'verde' : '';
  return '<span class="st ' + c + '">' + esc(t) + '</span>';
}

/* ---------------------------------------------------------------- menu */
function montarMenu() {
  var q = chave(el('buscaMenu') ? el('buscaMenu').value : '');
  var p = pend(), cont = { demandas: p.atras.length, fornecedores: p.seg.length };
  var h = '<div class="marca"><b>Sistema de Obras</b><span>' + esc(D.obra) + '</span></div>' +
    '<div class="busca"><input id="buscaMenu" type="search" placeholder="Procurar tela…" aria-label="Procurar tela" value="' + esc(q) + '" oninput="montarMenu();manterFoco(\'#buscaMenu\')"></div>' +
    '<div class="grupo"><a class="' + (ATUAL === 'executivo' ? 'on' : '') + '" onclick="ir(\'executivo\')">Visão Executiva</a><a class="' + (ATUAL === 'inicio' ? 'on' : '') + '" onclick="ir(\'inicio\')">Início</a>' +
    (mod('diario') ? '<a class="' + (ATUAL === 'relatorios' ? 'on' : '') + '" onclick="ir(\'relatorios\')">Relatórios</a>' : '') +
    '<a onclick="abrirIA()">✦ Assistente' + (D.ia && D.ia.ligado ? '' : ' <small style="opacity:.6">(desligado)</small>') + '</a></div>';
  CFG.grupos.forEach(function (g) {
    var ms = CFG.modulos.filter(function (m) { return m.grupo === g.id && (!q || chave(m.titulo + ' ' + m.serve).indexOf(q) >= 0); });
    if (!ms.length) return;
    h += '<div class="grupo"><div>' + esc(g.nome) + '</div>' + ms.map(function (m) {
      return '<a class="' + (ATUAL === m.id ? 'on ' : '') + (m.tipo === 'consulta' ? 'consulta' : '') + '" onclick="ir(\'' + m.id + '\')" title="' + esc(m.serve) + '">' + esc(m.titulo) +
        (cont[m.id] ? '<span class="ct">' + cont[m.id] + '</span>' : '') + '</a>';
    }).join('') + '</div>';
  });
  if (PM.admin && (!q || 'perfis de acesso'.indexOf(q) >= 0)) h += '<div class="grupo"><div>Administração</div><a class="' + (ATUAL === 'perfis' ? 'on' : '') + '" onclick="ir(\'perfis\')">Perfis de acesso</a></div>';
  h += '<div class="rodape">Conectado como ' + esc(D.usuario) + (PM.perfil ? '<br><span class="perfil-tag" title="' + esc(PM.descricao || '') + '">Perfil: ' + esc(PM.perfil) + '</span>' : '') +
    '<br>' + (PM.admin ? '<a href="' + esc(CFG.url) + '" target="_blank">Abrir a planilha</a> · ' : '') + '<a onclick="vObras()" style="cursor:pointer">Trocar de obra</a>' +
    '</div>';
  el('lado').innerHTML = h;
}
function menuMob() { el('app').classList.toggle('menu-aberto'); }
function ir(id) {
  ATUAL = id; el('app').classList.remove('menu-aberto'); fecharGaveta(); montarMenu(); window.scrollTo(0, 0);
  if (id === 'inicio') return vInicio();
  if (id === 'perfis') return vPerfis();
  if (id === 'relatorios') return vRelatorios();
  if (id === 'executivo') return vExecutivo();
  var m = mod(id);
  if (m.tipo === 'tabela') return vTabela(m);
  if (m.tipo === 'consulta') return vConsulta(m);
  if (m.tipo === 'presenca') return vPresenca(m);
  if (m.tipo === 'demandas') return vDemandas(m);
  if (m.tipo === 'fornecedores') return vFornecedores(m);
  if (m.tipo === 'diaristas') return vDiaristas(m);
}
function carimbo(titulo, serve, extra) {
  return '<section class="carimbo"><div class="tit"><h1>' + esc(titulo) + '</h1><p>' + esc(serve) + '</p></div><div class="cel">' +
    '<div><small>Obra</small>' + esc(D.obra) + '</div><div><small>Data</small>' + br(hoje()) + '</div>' +
    '<div class="usu"><small>Usuário</small>' + esc(D.usuario) + botaoTema() + '</div><div><small>' + esc(extra ? extra[0] : 'Aba') + '</small>' + esc(extra ? extra[1] : '—') + '</div></div></section>';
}
function guia(m, legenda) {
  if (!m.quando && !(m.passos || []).length) return '';
  return '<details class="guia"' + (window.innerWidth > 820 ? ' open' : '') + '><summary><h2>Como lançar</h2></summary><p class="qd"><b>Quando:</b> ' + esc(m.quando) + '</p>' +
    ((m.passos || []).length ? '<ol>' + m.passos.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>' : '') +
    (legenda !== false ? '<div class="leg">No formulário, cada campo traz a explicação do que digitar. Os valores calculados pela planilha aparecem no fim, só para consulta.</div>' : '') + '</details>';
}

/* ---------------------------------------------------------------- início */
function pend() {
  var ab = D.demandas.filter(function (d) { return d.Status !== 'Concluída'; });
  return {
    abertas: ab,
    atras: ab.filter(function (d) { return d.Prazo && dias(d.Prazo) < 0; }),
    prox: ab.filter(function (d) { return d.Prazo && dias(d.Prazo) >= 0 && dias(d.Prazo) <= 3; }),
    aguard: ab.filter(function (d) { return d.Status === 'Aguardando terceiros'; }),
    seg: D.interacoes.filter(function (i) { return i['Data do próximo passo'] && String(i['Feito?']).toUpperCase() !== 'SIM' && dias(i['Data do próximo passo']) <= 0; })
  };
}
function vInicio() {
  var p = pend(), n = (D.inicio && D.inicio.numeros) || [], pe = ((D.inicio && D.inicio.pend) || []).slice(), pn = D.inicio && D.inicio.painel;
  var alto = function (q) { return Number(String(q).replace(/[^\d]/g, '')) > 0 || /sem registro/.test(q); };
  pe = pe.filter(function (x) { // esconde pendências de telas que o perfil não acessa (ex.: custos para o encarregado)
    var alvo = PEND_MOD.filter(function (k) { return chave(x.assunto).indexOf(k[0]) >= 0; })[0];
    return PM.custos || (alvo ? !!mod(alvo[1]) : !/compra|cotaç|mediç|boleto|financeiro|orçamento|equipamento/i.test(x.assunto));
  });
  pe.sort(function (a, b) { return (alto(b.qtd) ? 1 : 0) - (alto(a.qtd) ? 1 : 0); }); // o que tem pendência vem primeiro
  var hr = new Date().getHours(), oi = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
  var h = carimbo(oi + ', ' + D.usuario, 'O que precisa de atenção hoje na obra e os números principais.', ['Pendências', pe.filter(function (x) { return alto(x.qtd); }).length + ' em aberto']);
  h += '<div class="atalhos so-grava">' + ['diario', 'presenca', 'producao', 'lancamentos', 'demandas'].filter(mod).map(function (id) {
    return '<button class="btn sec" onclick="ir(\'' + id + '\')">Lançar ' + esc(mod(id).titulo.toLowerCase()) + '</button>'; }).join('') + '</div>';
  if (pn) h += painel(pn);
  else if (n.length) h += '<div class="faixa">' + n.slice(0, 4).map(function (x) { return '<div><b>' + esc(x.valor || '—') + '</b><span>' + esc(x.campo) + '</span></div>'; }).join('') + '</div>';
  h += '<div class="duas-col"><div class="bloco"><h2>Pendências da planilha</h2><div class="pend">' + (pe.length ? pe.map(function (x) {
    var alvo = PEND_MOD.filter(function (k) { return chave(x.assunto).indexOf(k[0]) >= 0; })[0];
    return '<a ' + (alvo && mod(alvo[1]) ? 'onclick="ir(\'' + alvo[1] + '\')"' : '') + '><span>' + esc(x.assunto) + '</span><span class="q ' + (alto(x.qtd) ? 'alto' : '') + '">' + esc(x.qtd) + '</span></a>';
  }).join('') : '<a>Nada pendente.</a>') + '</div></div>';
  var lista = p.atras.concat(p.prox).sort(function (a, b) { return String(a.Prazo).localeCompare(String(b.Prazo)); });
  h += '<div class="bloco"><h2>Demandas e retornos</h2><div class="pend">' +
    '<a onclick="ir(\'demandas\')"><span>Demandas atrasadas</span><span class="q ' + (p.atras.length ? 'alto' : '') + '">' + p.atras.length + '</span></a>' +
    '<a onclick="ir(\'demandas\')"><span>Vencem em até 3 dias</span><span class="q ' + (p.prox.length ? 'alto' : '') + '">' + p.prox.length + '</span></a>' +
    '<a onclick="ir(\'demandas\')"><span>Aguardando terceiros</span><span class="q">' + p.aguard.length + '</span></a>' +
    (mod('fornecedores') ? '<a onclick="ir(\'fornecedores\')"><span>Retornos a fornecedores para hoje</span><span class="q ' + (p.seg.length ? 'alto' : '') + '">' + p.seg.length + '</span></a>' : '') + '</div>';
  if (lista.length) h += '<h2 style="margin-top:18px">Para resolver agora</h2><div class="pend">' + lista.map(function (d) {
    return '<a onclick="abrirDem(\'' + esc(d.ID) + '\')"><span>' + esc(d['Título']) + '<br><span class="info">' + esc(d['Responsável'] || '') + '</span></span><span style="margin-left:auto">' + prazoTag(d.Prazo) + '</span></a>'; }).join('') + '</div>';
  el('main').innerHTML = h + '</div></div>';
}

/* ---------------------------------------------------------------- gráficos do Início (SVG simples, sem biblioteca) */
function pct(x) { x = Number(x) || 0; return (x * 100).toLocaleString('pt-BR', { maximumFractionDigits: x && Math.abs(x) < 0.01 ? 2 : 1 }) + '%'; }
function rsc(v) { // R$ curto: 12,0 mi / 350 mil
  v = Number(v) || 0; var a = Math.abs(v);
  if (a >= 1e6) return 'R$ ' + (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e4) return 'R$ ' + Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil';
  return rs(v);
}
function dica(ev, t) { var d = el('dica'); if (!t) { d.style.display = 'none'; return; } d.textContent = t; d.style.display = 'block'; d.style.left = Math.min(ev.clientX + 12, innerWidth - d.offsetWidth - 8) + 'px'; d.style.top = (ev.clientY - 34) + 'px'; }
function hit(t) { return ' onmousemove="dica(event,\'' + esc(t).replace(/'/g, '') + '\')" onmouseleave="dica()" onfocus="dica(event,\'' + esc(t).replace(/'/g, '') + '\')" onblur="dica()" tabindex="0" aria-label="' + esc(t) + '"'; }
function cartao(tit, sub, corpo, largo) { return '<section class="graf' + (largo ? ' largo' : '') + '"><h3>' + esc(tit) + '</h3>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + corpo + '</section>'; }
function barraH(rot, valor, txt, cor, max) {
  var w = max > 0 ? Math.max(0, Math.min(100, valor / max * 100)) : 0;
  return '<div class="barra-h"><div class="rot"><span>' + esc(rot) + '</span><b>' + esc(txt) + '</b></div><div class="trilho"><div style="width:' + w + '%;background:' + cor + '"></div></div></div>';
}
function colunas(dados, cor, fmt, alturaPx, larguraVB) { // dados: [[rotulo, valor, rotuloCurto]]
  if (innerWidth < 640 && dados.length > 12) dados = dados.slice(-12);
  var W = larguraVB || (innerWidth < 640 ? 340 : 600), H = alturaPx || 170, base = H - 22, topo = 14, n = dados.length, max = Math.max.apply(null, dados.map(function (d) { return d[1]; }).concat([1]));
  var passo = W / n, larg = Math.max(4, Math.min(42, passo - 6)), cada = Math.ceil(n / 8), g = '';
  [0.5, 1].forEach(function (f) { var y = base - (base - topo) * f; g += '<line x1="0" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="var(--grade)" stroke-width="1"/>' +
    '<text x="0" y="' + (y - 3) + '">' + esc(fmt(max * f)) + '</text>'; });
  dados.forEach(function (d, i) {
    var hgt = (base - topo) * d[1] / max, x = i * passo + (passo - larg) / 2, y = base - hgt, r = Math.min(4, hgt / 2, larg / 2);
    if (hgt > 0) g += '<path d="M' + x + ',' + base + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + larg - r) + 'Q' + (x + larg) + ',' + y + ' ' + (x + larg) + ',' + (y + r) + 'V' + base + 'Z" fill="' + cor + '"/>';
    g += '<rect class="hit" x="' + (i * passo) + '" y="' + topo + '" width="' + passo + '" height="' + (base - topo + 22) + '"' + hit(d[0] + ': ' + fmt(d[1])) + '/>';
    if (i % cada === 0 || i === n - 1) g += '<text x="' + (i * passo + passo / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(d[2] || d[0]) + '</text>';
  });
  g += '<line x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '" stroke="var(--linha)" stroke-width="1"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de colunas">' + g + '</svg>';
}
function rosca(partes, cores) { // partes: [[rotulo, valor]]
  var tot = partes.reduce(function (s, x) { return s + x[1]; }, 0), R = 60, r = 38, cx = 70, cy = 70, a = -Math.PI / 2, g = '';
  if (tot <= 0) return '';
  partes.forEach(function (x, i) {
    if (x[1] <= 0) return;

/* ---------------------------------------------------------------- presença: mês inteiro */
var PMES = null, PMES_F = { vinc: '', q: '' };

  chamar('sisPresencaMes', mes || (PMES && PMES.mes) || hoje().slice(0, 7)).then(function (r) { PMES = r; desenharMes(); });
}
function valTrab(v) { if (/^\d+$/.test(v)) return Number(v); var c = codPres2(v); return c && c.conta ? c.conta : 0; }
function codPres2(v) { return ((PMES && PMES.codigos) || []).filter(function (x) { return x.c === v; })[0]; }
function catMes(v) { if (!v) return ''; if (/^\d+$/.test(v)) return 'num'; var c = codPres2(v); return !c ? 'out' : c.conta ? (c.conta < 1 ? 'meio' : 'trab') : c.falta ? 'falta' : 'just'; }
function desenharMes() {
  var r = PMES, f = PMES_F, sem = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  var ps = r.pessoas.filter(function (p) {
    return (!f.vinc || (f.vinc === 'emp' ? /empreiteiro|prestador/i.test(p.vinculo) : p.vinculo === f.vinc)) && (!f.q || chave(p.nome + ' ' + p.funcao + ' ' + p.empresa).indexOf(chave(f.q)) >= 0);
  });
  var tot = { trab: 0, falta: 0, just: 0 }, porDia = r.dias.map(function () { return 0; });
  ps.forEach(function (p) {
    p.t = { trab: 0, falta: 0, just: 0 };
    p.v.forEach(function (v, i) { var c = catMes(v), w = valTrab(v); p.t.trab += w; porDia[i] += w; if (c === 'falta') p.t.falta++; if (c === 'just') p.t.just++; });
    tot.trab += p.t.trab; tot.falta += p.t.falta; tot.just += p.t.just;
  });
  var nomeMes = r.dias.length ? new Date(r.dias[0] + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }) : r.mes;
  var h = abasPres('mes') + '<div class="barra nao-imprime"><label class="info" for="mPres">Mês</label><input id="mPres" type="month" style="width:170px" value="' + esc(r.mes) + '" onchange="vPresencaMes(this.value)">' +
    '<select id="mVinc" style="width:auto" onchange="PMES_F.vinc=this.value;desenharMes()">' + [['', 'Todos os vínculos'], ['Fichado (CLT)', 'Fichados (CLT)'], ['Diarista', 'Diaristas'], ['emp', 'Empreiteiros / prestadores']].map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (f.vinc === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>' +
    '<input id="mBusca" placeholder="Buscar nome, função ou empresa" value="' + esc(f.q) + '" style="width:230px" oninput="PMES_F.q=this.value;clearTimeout(window._tq);window._tq=setTimeout(function(){desenharMes();var b=el(\'mBusca\');b.focus();b.setSelectionRange(b.value.length,b.value.length)},300)">' +
    '<span class="esp"></span><button class="btn sec" onclick="window.print()">Imprimir / salvar PDF</button></div>';
  if (!r.dias.length) return el('area').innerHTML = h + '<div class="vazio"><b>Esse mês não está no calendário da aba Presença</b>A aba começa em ' + br(r.primeira) + '.</div>';
  h += '<h2 class="so-imprime">Folha de presença — ' + esc(nomeMes) + '</h2>';
  h += '<div class="faixa"><div><b>' + ps.length + '</b><span>Pessoas</span></div><div><b>' + num(tot.trab) + '</b><span>Dias trabalhados (homens-dia)</span></div>' +
    '<div><b>' + tot.falta + '</b><span>Faltas</span></div><div><b>' + tot.just + '</b><span>Ausências justificadas</span></div></div>';
  h += '<div class="tabela mes-grade"><table><thead><tr><th class="fixa">Nome</th>' + r.dias.map(function (d) {
    var dt = new Date(d + 'T12:00:00'), fds = dt.getDay() === 0 || dt.getDay() === 6;
    return '<th class="dia' + (fds ? ' fds' : '') + (d === hoje() ? ' hoje' : '') + '"><a onclick="vPresenca(mod(\'presenca\'),\'' + d + '\')" title="Abrir o dia ' + br(d) + '">' + Number(d.slice(8)) + '<small>' + sem[dt.getDay()] + '</small></a></th>'; }).join('') +
    '<th class="tot">Trab.</th><th class="tot">Faltas</th><th class="tot">Just.</th></tr></thead><tbody>' + ps.map(function (p) {
      return '<tr style="cursor:default"><td class="fixa"><b>' + esc(p.nome) + '</b><span class="info">' + esc(p.funcao) + (p.empresa ? ' · ' + esc(p.empresa) : '') + '</span></td>' + p.v.map(function (v, i) {
        var c = catMes(v), dt = new Date(r.dias[i] + 'T12:00:00'), fds = dt.getDay() === 0 || dt.getDay() === 6, cd = codPres2(v);
        return '<td class="cel ' + c + (fds ? ' fds' : '') + '" title="' + esc(br(r.dias[i]) + ': ' + (v ? (cd ? cd.nome : v + ' pessoa(s)') : 'sem marcação') + (p.obs[i] ? ' — ' + p.obs[i] : '')) + '">' + esc(v) + (p.obs[i] ? '<i aria-hidden="true">•</i>' : '') + '</td>';
      }).join('') + '<td class="tot"><b>' + num(p.t.trab) + '</b></td><td class="tot' + (p.t.falta ? ' ruim' : '') + '">' + p.t.falta + '</td><td class="tot">' + p.t.just + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><td class="fixa"><b>Efetivo do dia</b></td>' + porDia.map(function (x) { return '<td class="cel">' + (x ? num(x) : '') + '</td>'; }).join('') +
    '<td class="tot"><b>' + num(tot.trab) + '</b></td><td class="tot">' + tot.falta + '</td><td class="tot">' + tot.just + '</td></tr></tfoot></table></div>';
  // por empreiteiro
  var emp = {}; ps.filter(function (p) { return /empreiteiro|prestador/i.test(p.vinculo); }).forEach(function (p) {
    var k = p.empresa || 'Sem empresa informada'; emp[k] = emp[k] || { pessoas: 0, trab: 0, falta: 0, dias: 0 };
    emp[k].pessoas++; emp[k].trab += p.t.trab; emp[k].falta += p.t.falta; emp[k].dias += p.v.filter(function (v) { return valTrab(v) > 0; }).length;
  });
  var ks = Object.keys(emp).sort();
  if (ks.length) h += '<h2 style="margin-top:22px">Por empreiteiro</h2><p class="info nao-imprime">Some os homens-dia de cada empresa para conferir a medição. Cadastre o nome do empreiteiro na coluna "Empresa / empreiteiro" da tela Pessoas.</p>' +
    '<div class="tabela"><table><thead><tr><th>Empresa / empreiteiro</th><th>Linhas na folha</th><th>Dias com gente na obra</th><th>Homens-dia no mês</th><th>Faltas</th></tr></thead><tbody>' +
    ks.map(function (k) { var e = emp[k]; return '<tr style="cursor:default"><td><b>' + esc(k) + '</b></td><td>' + e.pessoas + '</td><td>' + e.dias + '</td><td><b>' + num(e.trab) + '</b></td><td>' + e.falta + '</td></tr>'; }).join('') + '</tbody></table></div>';
  h += '<p class="info">Toque no número do dia para abrir e lançar aquele dia. • = tem motivo anotado (passe o mouse ou toque para ver). Sábados e domingos em cinza.</p>' +
    '<div class="so-imprime assinaturas"><span>Responsável pela obra</span><span>Encarregado</span></div>';
  el('area').innerHTML = h; el('area').classList.add('pagina-deitada');
}
function num(x) { return (Math.round(x * 10) / 10).toLocaleString('pt-BR'); }

function codPres(c) { return (PRES.codigos || []).filter(function (x) { return x.c === c; })[0]; }
function catPres(v) { // trabalhando / falta / justificada / numero / vazio
  if (v === '' || v == null) return 'vazio';
  if (/^\d+$/.test(String(v))) return 'numero';
  var c = codPres(v); return !c ? 'outro' : c.conta ? 'trab' : c.falta ? 'falta' : 'just';
}
function desenharPresenca() {
  var r = PRES, ativos = r.pessoas.filter(function (p) { return p.situacao !== 'Desligado'; });
  var n = { trab: 0, falta: 0, just: 0, vazio: 0, numero: 0, outro: 0 }; ativos.forEach(function (p) { n[catPres(p.valor)]++; });
  var h = abasPres('dia') + '<div class="barra"><label class="info" for="dPres">Dia</label><input id="dPres" type="date" style="width:170px" value="' + r.data + '" onchange="vPresenca(mod(\'presenca\'),this.value)">' +
    '<span class="esp"></span><button class="btn sec so-grava" onclick="todosPresentes()">Marcar os que faltam como presentes</button></div>';
  if (!r.col) { el('area').innerHTML = h + '<div class="vazio"><b>Esse dia não está no calendário da aba Presença</b>A aba começa em ' + br(r.primeira) + '. Escolha uma data a partir daí.</div>'; return; }
  if (!ativos.length) { el('area').innerHTML = h + '<div class="vazio"><b>Ninguém cadastrado ainda</b>Cadastre as pessoas na tela Pessoas.<br><br><button class="btn" onclick="ir(\'pessoas\')">Ir para Pessoas</button></div>'; return; }
  h += '<div class="faixa pres-resumo"><div><b>' + (n.trab + n.numero) + '</b><span>Trabalhando</span></div><div><b>' + n.falta + '</b><span>Faltas</span></div>' +
    '<div><b>' + n.just + '</b><span>Ausências justificadas</span></div><div><b' + (n.vazio ? ' style="color:var(--verm)"' : '') + '>' + n.vazio + '</b><span>Sem marcação</span></div></div>';
  var outros = (r.codigos || []).filter(function (x) { return ['P', '½', 'F'].indexOf(x.c) < 0; });
  h += '<div class="tabela pres"><table><thead><tr><th>Nome</th><th class="nao-mob">Função</th><th>Presença</th></tr></thead><tbody>' + ativos.map(function (p) {
    var cat = catPres(p.valor), outro = cat !== 'vazio' && ['P', '½', 'F'].indexOf(p.valor) < 0 && cat !== 'numero', emp = /empreiteiro|prestador/i.test(p.vinculo);
    var ctl = '<div class="pres-ctl"><div class="seg" role="group" aria-label="Presença de ' + esc(p.nome) + '">' +
      ['P', '½', 'F'].map(function (v) { var c = codPres(v) || { nome: v };
        return '<button class="' + (v === '½' ? 'm' : v) + (p.valor === v ? ' on' : '') + '" aria-pressed="' + (p.valor === v) + '" title="' + esc(c.nome) + '" onclick="marcar(' + p.linha + ',\'' + v + '\')">' + v + '</button>'; }).join('') + '</div>' +
      '<select class="pres-outro' + (outro ? ' on ' + cat : '') + '" aria-label="Outro código para ' + esc(p.nome) + '" onchange="marcar(' + p.linha + ',this.value,true)">' +
      '<option value="">' + (outro ? '' : 'Outro…') + '</option>' + outros.map(function (x) { return '<option value="' + esc(x.c) + '"' + (p.valor === x.c ? ' selected' : '') + '>' + esc(x.c + ' — ' + x.nome) + '</option>'; }).join('') + '</select>' +
      (emp ? '<input class="pres-num" inputmode="numeric" placeholder="nº pessoas" title="Equipe do empreiteiro: quantas pessoas vieram" value="' + (cat === 'numero' ? esc(p.valor) : '') + '" onchange="marcar(' + p.linha + ',this.value.replace(/\\D/g,\'\'),true)">' : '') + '</div>';
    if (cat === 'just' || cat === 'falta') ctl += '<input class="pres-obs" placeholder="Motivo (opcional)" value="' + esc(p.obs || '') + '" onchange="motivo(' + p.linha + ',this.value)">';
    return '<tr style="cursor:default"><td><b>' + esc(p.nome) + '</b><span class="info"><br><span class="so-mob">' + esc(p.funcao) + ' · </span>' + esc(p.vinculo) + '</span></td><td class="nao-mob">' + esc(p.funcao) + '</td><td>' + ctl + '</td></tr>';
  }).join('') + '</tbody></table></div>' +
    '<details class="legenda-pres"><summary>O que significa cada código</summary><ul>' + (r.codigos || []).map(function (x) {
      return '<li><b>' + esc(x.c) + '</b> ' + esc(x.nome) + ' <span class="info">— ' + (x.conta ? 'conta como dia trabalhado' : x.falta ? 'conta como falta' : 'ausência justificada (não conta como falta nem como dia trabalhado)') + '</span></li>'; }).join('') +
    '<li><b>número</b> Equipe de empreiteiro: quantas pessoas vieram no dia</li></ul><p class="info">Toque de novo no mesmo botão para desmarcar. Grava na hora na aba Presença. O motivo fica como nota na célula.</p></details>';
  el('area').innerHTML = h;
}
function marcar(linha, v, direto) {
  var p = PRES.pessoas.filter(function (x) { return x.linha === linha; })[0], ant = p.valor, antObs = p.obs;
  p.valor = (!direto && p.valor === v) ? '' : v;
  var limpaObs = catPres(p.valor) !== 'just' && catPres(p.valor) !== 'falta' && p.obs;
  if (limpaObs) p.obs = '';
  desenharPresenca();
  var args = ['sisPresencaMarcar', linha, PRES.col, p.valor]; if (limpaObs) args.push('');
  api.apply(null, args).catch(function (e) { p.valor = ant; p.obs = antObs; desenharPresenca(); aviso('Não salvou: ' + (e.message || e), 6000); });
}
function motivo(linha, txt) {
  var p = PRES.pessoas.filter(function (x) { return x.linha === linha; })[0]; p.obs = txt.trim();
  api('sisPresencaMarcar', linha, PRES.col, p.valor, p.obs).then(function () { aviso('Motivo salvo.'); }, function (e) { aviso('Não salvou o motivo: ' + (e.message || e), 6000); });
}
function todosPresentes() {
  var fila = PRES.pessoas.filter(function (p) { return p.situacao !== 'Desligado' && !p.valor; });
  if (!fila.length) { aviso('Todos já estão marcados.'); return; }
  fila.forEach(function (p) { p.valor = 'P'; }); desenharPresenca(); ocupado(true);
  Promise.all(fila.map(function (p) { return api('sisPresencaMarcar', p.linha, PRES.col, 'P'); })).then(function () { ocupado(false); aviso(fila.length + ' presença(s) marcadas.'); },
    function (e) { ocupado(false); aviso('Algumas não salvaram: ' + (e.message || e), 6000); vPresenca(mod('presenca'), PRES.data); });
}

/* ---------------------------------------------------------------- demandas */
function vDemandas(m) { el('main').innerHTML = carimbo(m.titulo, m.serve, ['Aba da planilha', 'CRM Demandas']) + '<div id="area"></div>'; desenharDemandas(); }
function desenharDemandas() {
  var m = mod('demandas'), q = chave(BUSCA.dem || ''), r = FILTRO.resp;
  var ds = D.demandas.filter(function (d) { return (!q || chave(d['Título'] + ' ' + d['Descrição'] + ' ' + d.Solicitante).indexOf(q) >= 0) && (!r || d['Responsável'] === r); });
  var resps = D.pessoas.slice(); D.demandas.forEach(function (d) { if (d['Responsável'] && resps.indexOf(d['Responsável']) < 0) resps.push(d['Responsável']); });
  var h = '<div class="barra"><input type="search" id="buscaDem" aria-label="Buscar demanda" placeholder="Buscar demanda…" value="' + esc(BUSCA.dem || '') + '" oninput="BUSCA.dem=this.value;desenharDemandas();manterFoco(\'#buscaDem\')">' +
    '<select style="width:210px" aria-label="Responsável" onchange="FILTRO.resp=this.value;desenharDemandas()">' + opts(resps.sort(), FILTRO.resp, 'Todos os responsáveis') + '</select><span class="esp"></span>' +
    '<button class="btn so-grava" onclick="abrirDem()">+ Nova demanda</button></div><div class="quadro">';
  D.status.forEach(function (st, i) {
    var cs = ds.filter(function (d) { return (d.Status || 'A fazer') === st; }).sort(function (a, b) { return (a.Prazo || '9999').localeCompare(b.Prazo || '9999'); });
    if (st === 'Concluída') cs = cs.slice(-15).reverse();
    h += '<div class="coluna"><h3>' + esc(st) + '<span class="info">' + cs.length + '</span></h3>' + cs.map(function (d) {
      return '<div class="cartao ' + esc(d.Prioridade || 'Média') + '" tabindex="0" onkeydown="if(event.key===\'Enter\')this.click()" onclick="abrirDem(\'' + esc(d.ID) + '\')"><div class="t">' + esc(d['Título']) + '</div><div class="m">' +
        (d['Responsável'] ? '<span>' + esc(d['Responsável']) + '</span>' : '') + (d.Origem ? '<span class="st">' + esc(d.Origem) + '</span>' : '') + prazoTag(d.Prazo, st === 'Concluída') + '</div>' +
        '<div class="mv so-grava">' + (i > 0 ? '<button class="btn sec peq" onclick="event.stopPropagation();mover(\'' + esc(d.ID) + '\',-1)" aria-label="Voltar uma etapa">◀</button>' : '') +
        (i < 3 ? '<button class="btn sec peq" onclick="event.stopPropagation();mover(\'' + esc(d.ID) + '\',1)">Mover para ' + esc(D.status[i + 1].toLowerCase()) + '</button>' : '') + '</div></div>';
    }).join('') + (cs.length ? '' : '<div class="info" style="padding:6px">Nenhuma</div>') + '</div>';
  });
  el('area').innerHTML = h + '</div><div style="margin-top:18px;max-width:640px">' + guia(m, false) + '</div>';
}
function acharDem(id) { return D.demandas.filter(function (d) { return d.ID === id; })[0]; }
function salvarCRM(fn, arg, msg) { return chamar(fn, arg).then(function (r) { D = r; fecharGaveta(); montarMenu(); ir(ATUAL); aviso(msg); return r; }); }
function mover(id, passo) { var d = Object.assign({}, acharDem(id)), i = D.status.indexOf(d.Status || 'A fazer'); d.Status = D.status[Math.max(0, Math.min(3, i + passo))]; salvarCRM('sisSalvarDemanda', d, 'Movida para "' + d.Status + '".'); }
function campo(rot, ctl, aj) { return '<div class="campo"><label>' + esc(rot) + '</label>' + ctl + (aj ? '<div class="aj">' + esc(aj) + '</div>' : '') + '</div>'; }
function abrirDem(id) {
  var d = id ? acharDem(id) : { Status: 'A fazer', Prioridade: 'Média', Obra: D.obra, 'Responsável': D.usuario };
  var nomes = D.pessoas.slice(); if (d['Responsável'] && nomes.indexOf(d['Responsável']) < 0) nomes.unshift(d['Responsável']);
  abrirGaveta('<header><h2>' + (id ? 'Demanda' : 'Nova demanda') + '</h2><div class="info">' + (id ? esc(d.Status) : 'Grava na aba CRM Demandas da planilha') + '</div></header><div class="conteudo">' +
    campo('O que precisa ser feito (obrigatório)', '<input id="fTit" value="' + esc(d['Título']) + '">', 'Uma frase curta e clara. Ex.: "Pedir a prancha PL01 R02 ao arquiteto".') +
    campo('Detalhes', '<textarea id="fDesc">' + esc(d['Descrição']) + '</textarea>', 'Contexto, links, nº de protocolo.') +
    '<div class="duas">' + campo('Quem pediu', '<input id="fSol" value="' + esc(d.Solicitante) + '">') + campo('Origem', '<select id="fOri">' + opts(ORIGENS, d.Origem, '') + '</select>') +
    campo('Responsável', '<input id="fResp" list="lResp" value="' + esc(d['Responsável']) + '"><datalist id="lResp">' + nomes.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>', 'Quem vai resolver.') +
    campo('Prazo', '<input id="fPrazo" type="date" value="' + esc(String(d.Prazo || '').slice(0, 10)) + '">', 'Aparece no Início quando faltarem 3 dias.') +
    campo('Prioridade', '<select id="fPri">' + opts(['Alta', 'Média', 'Baixa'], d.Prioridade) + '</select>') + campo('Situação', '<select id="fSt">' + opts(D.status, d.Status) + '</select>') + '</div>' +
    campo('Obra', '<input id="fObra" value="' + esc(d.Obra || D.obra) + '">') +
    (d['Histórico'] ? '<div class="secao">Histórico</div><div class="hist">' + esc(d['Histórico']) + '</div>' : '') +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn so-grava" onclick="gravarDem(\'' + esc(d.ID || '') + '\')">Salvar demanda</button></footer>');
}
function gravarDem(id) {
  var d = Object.assign({}, id ? acharDem(id) : {}, { ID: id || '', 'Título': el('fTit').value.trim(), 'Descrição': el('fDesc').value.trim(), Solicitante: el('fSol').value.trim(),
    Origem: el('fOri').value, 'Responsável': el('fResp').value.trim(), Prazo: el('fPrazo').value, Prioridade: el('fPri').value, Status: el('fSt').value, Obra: el('fObra').value.trim() });
  if (!d['Título']) { aviso('Escreva o que precisa ser feito.'); return; }
  salvarCRM('sisSalvarDemanda', d, 'Demanda salva.');
}

/* ---------------------------------------------------------------- fornecedores */
function hist(f) { return (D.historico && D.historico[chave(f.Nome)]) || { cotacoes: [], contratos: [], medicoes: [], lancamentos: [], compras: [], servicos: [] }; }
function soma(l, k) { return l.reduce(function (a, x) { return a + (Number(x[k]) || 0); }, 0); }
function notaMedia(f) { var v = ['Nota prazo', 'Nota qualidade', 'Nota preço'].map(function (k) { return Number(f[k]) || 0; }).filter(Boolean); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : 0; }
function estrelas(n) { n = Math.round(n || 0); return n ? '<span class="nota" aria-label="' + n + ' de 5">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</span>' : '<span class="info">sem nota</span>'; }
function vFornecedores(m) { el('main').innerHTML = carimbo(m.titulo, m.serve, ['Aba da planilha', 'CRM Fornecedores']) + '<div class="corpo"><div id="area"></div>' + guia(m, false) + '</div>'; desenharFornecedores(); }
function desenharFornecedores() {
  var q = chave(BUSCA.forn || ''), t = FILTRO.fTipo;
  var fs = D.fornecedores.filter(function (f) { return (!q || chave(f.Nome + ' ' + f['Categoria / serviço'] + ' ' + f.Contato).indexOf(q) >= 0) && (!t || f.Tipo === t); })
    .sort(function (a, b) { return String(a.Nome).localeCompare(String(b.Nome)); });
  var sem = Object.keys(D.historico || {}).filter(function (k) { return !D.fornecedores.some(function (f) { return chave(f.Nome) === k; }); });
  var h = '<div class="barra"><input type="search" id="buscaForn" aria-label="Buscar fornecedor" placeholder="Buscar nome ou serviço…" value="' + esc(BUSCA.forn || '') + '" oninput="BUSCA.forn=this.value;desenharFornecedores();manterFoco(\'#buscaForn\')">' +
    '<select style="width:220px" aria-label="Tipo" onchange="FILTRO.fTipo=this.value;desenharFornecedores()">' + opts(TIPOS_FORN, FILTRO.fTipo, 'Todos os tipos') + '</select><span class="esp"></span>' +
    '<button class="btn so-grava" onclick="abrirForn()">+ Novo cadastro</button></div>';
  if (sem.length) h += '<div class="pend" style="margin-bottom:12px"><a onclick="importar()"><span><b>' + sem.length + ' nome(s) já aparecem na planilha e não estão no cadastro</b><br><span class="info">' +
    esc(sem.slice(0, 6).map(function (k) { return D.historico[k].nome; }).join(', ')) + (sem.length > 6 ? '…' : '') + '</span></span><span class="btn peq" style="margin-left:auto">Importar todos</span></a></div>';
  if (!fs.length) { el('area').innerHTML = h + '<div class="vazio"><b>Nenhum cadastro ainda</b>Use "Importar todos" ou "+ Novo cadastro".</div>'; return; }
  h += '<div class="tabela"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Serviço</th><th>Avaliação</th><th>Cotações</th><th>Contratado</th><th>Próximo retorno</th></tr></thead><tbody>' + fs.map(function (f) {
    var x = hist(f), seg = D.interacoes.filter(function (i) { return i['Fornecedor ID'] === f.ID && i['Data do próximo passo'] && String(i['Feito?']).toUpperCase() !== 'SIM'; })
      .sort(function (a, b) { return a['Data do próximo passo'].localeCompare(b['Data do próximo passo']); })[0];
    return '<tr tabindex="0" onkeydown="if(event.key===\'Enter\')this.click()" onclick="abrirForn(\'' + esc(f.ID) + '\')"><td><b>' + esc(f.Nome) + '</b>' + (f['Situação'] && f['Situação'] !== 'Ativo' ? ' ' + stTag(f['Situação']) : '') + '</td><td>' + esc(f.Tipo) + '</td><td>' + esc(f['Categoria / serviço']) +
      '</td><td>' + estrelas(notaMedia(f)) + '</td><td class="num">' + x.cotacoes.length + ' (' + x.cotacoes.filter(function (c) { return c.escolhido; }).length + ' fechadas)</td><td class="num">' + rs(soma(x.contratos, 'valor') || null) +
      '</td><td>' + (seg ? esc(seg['Próximo passo'] || 'retorno') + ' ' + prazoTag(seg['Data do próximo passo']) : '') + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  el('area').innerHTML = h;
}
function importar() { chamar('sisImportarFornecedores', null).then(function (r) { D = r; montarMenu(); desenharFornecedores(); aviso((r.importados || 0) + ' cadastro(s) importado(s).'); }); }
function acharForn(id) { return D.fornecedores.filter(function (f) { return f.ID === id; })[0]; }
function abrirForn(id, aba) {
  var f = id ? acharForn(id) : { Tipo: 'Fornecedor', 'Situação': 'Ativo' }; ABA_F = id ? (aba || 'dados') : 'dados';
  var x = id ? hist(f) : null, ints = id ? D.interacoes.filter(function (i) { return i['Fornecedor ID'] === id; }).sort(function (a, b) { return String(b.Data).localeCompare(String(a.Data)); }) : [];
  var h = '<header><h2>' + esc(f.Nome || 'Novo cadastro') + '</h2><div class="info">' + esc([f.Tipo, f['Categoria / serviço']].filter(Boolean).join(', ')) + '</div></header><div class="conteudo">';
  if (id) h += '<div class="abas">' + [['dados', 'Cadastro'], ['contatos', 'Contatos (' + ints.length + ')'], ['obra', 'Na obra (' + (x.cotacoes.length + x.contratos.length + x.medicoes.length + x.lancamentos.length + x.compras.length) + ')']]
    .map(function (a) { return '<button class="' + (ABA_F === a[0] ? 'on' : '') + '" onclick="abrirForn(\'' + esc(id) + '\',\'' + a[0] + '\')">' + a[1] + '</button>'; }).join('') + '</div>';
  var rod = '<span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Fechar</button>';
  if (ABA_F === 'dados') {
    h += campo('Nome / razão social (obrigatório)', '<input id="nNome" value="' + esc(f.Nome) + '">', 'Escreva igual ao usado nas Cotações, Contratos e Lançamentos: é assim que o histórico é encontrado.') +
      '<div class="duas">' + campo('Tipo', '<select id="nTipo">' + opts(TIPOS_FORN, f.Tipo) + '</select>') + campo('Serviço / material', '<input id="nCat" value="' + esc(f['Categoria / serviço']) + '">') +
      campo('Pessoa de contato', '<input id="nCont" value="' + esc(f.Contato) + '">') + campo('Telefone / WhatsApp', '<input id="nTel" value="' + esc(f.Telefone) + '">') +
      campo('E-mail', '<input id="nMail" value="' + esc(f['E-mail']) + '">') + campo('CNPJ / CPF', '<input id="nDoc" value="' + esc(f['CNPJ / CPF']) + '">') +
      campo('Cidade', '<input id="nCid" value="' + esc(f.Cidade) + '">') + campo('Situação', '<select id="nSit">' + opts(['Ativo', 'Em avaliação', 'Não contratar'], f['Situação']) + '</select>') + '</div>' +
      '<div class="secao">Avaliação<small>1 = ruim, 5 = ótimo. Preencha ao fim de cada serviço.</small></div><div class="duas">' +
      ['Nota prazo', 'Nota qualidade', 'Nota preço'].map(function (k, i) { return campo(['Cumpre prazo', 'Qualidade', 'Preço'][i], '<select id="nN' + i + '">' + opts(['', '1', '2', '3', '4', '5'], String(f[k] || '')) + '</select>'); }).join('') + '</div>' +
      campo('Observações', '<textarea id="nObs">' + esc(f['Observações']) + '</textarea>');
    rod = (f.Telefone ? '<a class="btn sec" target="_blank" href="https://wa.me/55' + esc(String(f.Telefone).replace(/\D/g, '').replace(/^55/, '')) + '">Abrir WhatsApp</a>' : '') + rod +
      '<button class="btn so-grava" onclick="gravarForn(\'' + esc(f.ID || '') + '\')">Salvar cadastro</button>';
  } else if (ABA_F === 'contatos') {
    h += '<div class="duas">' + campo('Tipo de contato', '<select id="iTipo">' + opts(TIPOS_INT, 'WhatsApp') + '</select>') + campo('Data', '<input id="iData" type="date" value="' + hoje() + '">') + '</div>' +
      campo('O que foi conversado (obrigatório)', '<textarea id="iRes" placeholder="Ex.: pediu até sexta para mandar a proposta"></textarea>') +
      '<div class="duas">' + campo('Próximo passo', '<input id="iProx" placeholder="Ex.: cobrar a proposta">') + campo('Até quando', '<input id="iProxD" type="date">', 'Aparece no Início nesse dia.') + '</div>' +
      '<button class="btn so-grava" onclick="gravarInt(\'' + esc(id) + '\')">Registrar contato</button>';
    if (ints.length) h += '<div class="secao">Histórico</div><div class="tabela"><table><tbody>' + ints.map(function (i) {
      var pd = i['Data do próximo passo'] && String(i['Feito?']).toUpperCase() !== 'SIM';
      return '<tr style="cursor:default"><td style="white-space:nowrap">' + br(i.Data) + '<div class="info">' + esc(i.Tipo) + '</div></td><td>' + esc(i.Resumo) +
        (i['Próximo passo'] ? '<div class="info">Próximo: ' + esc(i['Próximo passo']) + ' ' + prazoTag(i['Data do próximo passo'], !pd) + '</div>' : '') + '</td><td>' +
        (pd ? '<button class="btn sec peq so-grava" onclick="feito(\'' + esc(i.ID) + '\')">Marcar como feito</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  } else {
    var tab = function (t, l, c) { return l.length ? '<div class="secao">' + esc(t) + ' (' + l.length + ')</div><div class="tabela"><table><thead><tr>' + c.map(function (k) { return '<th>' + esc(k[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      l.map(function (r) { return '<tr style="cursor:default">' + c.map(function (k) { var v = r[k[1]]; return '<td class="' + (k[3] ? 'num' : '') + '">' + (k[2] ? k[2](v) : esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : ''; };
    h += tab('Cotações', x.cotacoes, [['Nº', 'n'], ['Data', 'data', brCurta], ['Serviço', 'servico'], ['Valor', 'valor', rs, 1], ['', 'escolhido', function (v) { return v ? stTag('fechou') : ''; }]]) +
      tab('Contratos', x.contratos, [['Nº', 'n'], ['Serviço', 'servico'], ['Valor', 'valor', rs, 1], ['Medido', 'medido', rs, 1]]) +
      tab('Medições', x.medicoes, [['Data', 'data', brCurta], ['Contrato', 'contrato'], ['Líquido', 'liquido', rs, 1], ['', 'pago', function (v) { return v ? stTag('pago') : stTag('a pagar'); }]]) +
      tab('Notas e boletos', x.lancamentos, [['Venc.', 'vencimento', brCurta], ['Descrição', 'descricao'], ['Valor', 'valor', rs, 1], ['Situação', 'status', stTag]]) +
      tab('Compras', x.compras, [['Material', 'material'], ['Previsto', 'prevista', brCurta], ['Entregue', 'real', brCurta], ['Situação', 'status', stTag]]);
    if (!(x.cotacoes.length + x.contratos.length + x.medicoes.length + x.lancamentos.length + x.compras.length)) h += '<div class="vazio"><b>Esse nome ainda não aparece na planilha</b>Confira se está escrito igual nas Cotações, Contratos, Lançamentos ou Compras.</div>';
  }
  abrirGaveta(h + '</div><footer>' + rod + '</footer>');
}
function gravarForn(id) {
  var f = Object.assign({}, id ? acharForn(id) : {}, { ID: id || '', Nome: el('nNome').value.trim(), Tipo: el('nTipo').value, 'Categoria / serviço': el('nCat').value.trim(), Contato: el('nCont').value.trim(),
    Telefone: el('nTel').value.trim(), 'E-mail': el('nMail').value.trim(), 'CNPJ / CPF': el('nDoc').value.trim(), Cidade: el('nCid').value.trim(), 'Situação': el('nSit').value,
    'Nota prazo': el('nN0').value, 'Nota qualidade': el('nN1').value, 'Nota preço': el('nN2').value, 'Observações': el('nObs').value.trim() });
  if (!f.Nome) { aviso('Preencha o nome.'); return; }
  salvarCRM('sisSalvarFornecedor', f, 'Cadastro salvo.');
}
function gravarInt(fid) {
  var f = acharForn(fid), i = { 'Fornecedor ID': fid, Fornecedor: f.Nome, Tipo: el('iTipo').value, Data: el('iData').value, Resumo: el('iRes').value.trim(), 'Próximo passo': el('iProx').value.trim(), 'Data do próximo passo': el('iProxD').value, 'Feito?': '' };
  if (!i.Resumo) { aviso('Escreva o que foi conversado.'); return; }
  salvarCRM('sisSalvarInteracao', i, 'Contato registrado.').then(function () { abrirForn(fid, 'contatos'); });
}
function feito(iid) { var i = Object.assign({}, D.interacoes.filter(function (x) { return x.ID === iid; })[0], { 'Feito?': 'SIM' }); salvarCRM('sisSalvarInteracao', i, 'Marcado como feito.').then(function () { abrirForn(i['Fornecedor ID'], 'contatos'); }); }

/* ---------------------------------------------------------------- gaveta */
function abrirGaveta(h) { el('gaveta').innerHTML = h; document.body.classList.add('aberta'); var f = el('gaveta').querySelector('input,select,textarea'); if (f) setTimeout(function () { f.focus(); }, 230); }
function fecharGaveta() { document.body.classList.remove('aberta'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { fecharGaveta(); fecharIA(); } });

/* ---------------------------------------------------------------- obras */
function urlObra(id) { if (window.google && google.script && google.script.history) google.script.history.replace(null, id ? { obra: id } : {}); }
function abrirObra(id) {
  OBRA = id; D = null; CFG = null; CACHE = {}; BUSCA = {}; LIMITE = {}; ATUAL = 'inicio'; urlObra(id);
  el('app').classList.remove('sem-lado');
  el('lado').innerHTML = ''; el('main').innerHTML = '<div class="vazio"><b>Abrindo a planilha da obra…</b>Isso leva alguns segundos.</div>';
  chamar('sisCarregar').then(function (r) {
    D = r; CFG = r.config; PM = r.permissoes || PM;
    if (PM.modulos) CFG.modulos = CFG.modulos.filter(function (m) { return PM.modulos.indexOf(m.id) >= 0; });
    document.body.classList.toggle('somente-leitura', !PM.grava);
    el('iaFab').style.display = r.ia && r.ia.ligado ? '' : 'none'; IA_HIST = [];
    montarMenu(); ir('inicio');
    if (r.avisoPlanilha) aviso(r.avisoPlanilha, 9000);
  }, function (e) {
    el('main').innerHTML = '<div class="vazio"><b>Não consegui abrir esta obra</b>' + esc(e && e.message ? e.message : e) + '<br><br><button class="btn" onclick="vObras()">Escolher outra obra</button></div>';
  });
}
function vObras(forcar) {
  fecharGaveta(); el('app').classList.add('sem-lado'); el('app').classList.remove('menu-aberto'); urlObra('');
  var desenhar = function (r) {
    OBRAS = r;
    var h = '<section class="carimbo"><div class="tit"><h1>Suas obras</h1><p>Escolha a obra para abrir. Aparecem só as obras cujas planilhas foram compartilhadas com você.</p></div><div class="cel">' +
      '<div class="usu"><small>Usuário</small>' + esc(r.usuario) + botaoTema() + '</div><div><small>Obras com acesso</small>' + r.obras.length + ' de ' + r.total + '</div></div></section>' +
      '<div class="corpo"><div><div class="barra"><span class="esp"></span><button class="btn sec" onclick="formCadastrarObra()">Cadastrar obra existente</button>' +
      '<button class="btn" onclick="formNovaObra()">+ Nova obra a partir do modelo</button></div>';
    h += r.obras.length ? '<div class="obras">' + r.obras.map(function (o) {
      return '<div class="obra"><button class="abre" onclick="abrirObra(\'' + esc(o.id) + '\')"><b>' + esc(o.nome) + '</b><span>' + (o.resp ? 'Responsáveis: ' + esc(o.resp) : 'Abrir o sistema desta obra') + '</span></button>' +
        '<div class="acoes"><a onclick="tirarObra(\'' + esc(o.id) + '\',\'' + esc(o.nome).replace(/'/g, '') + '\')">Tirar da lista</a></div></div>';
    }).join('') + '</div>' : '<div class="vazio"><b>Nenhuma obra liberada para você ainda</b>Peça ao responsável para compartilhar a planilha da obra com o seu e-mail (como Editor), ou cadastre uma obra.</div>';
    h += '</div><details class="guia"' + (window.innerWidth > 820 ? ' open' : '') + '><summary><h2>Como funciona</h2></summary><ol>' +
      '<li>Cada obra é uma planilha, copiada do Modelo.</li>' +
      '<li>Quem vê cada obra é decidido no <b>Compartilhar</b> da planilha: dê acesso de <b>Editor</b> só ao engenheiro e à equipe daquela obra.</li>' +
      '<li>A diretoria recebe acesso a todas e vê todas aqui.</li>' +
      '<li>"Nova obra" copia o Modelo para o seu Drive, já com o nome, e compartilha com os e-mails que você informar.</li>' +
      '<li>"Tirar da lista" não apaga a planilha.</li></ol>' +
      (r.temModelo ? '' : '<div class="leg">Para criar obras novas, primeiro informe o link da planilha Modelo em "+ Nova obra".</div>') + '</details></div>';
    el('main').innerHTML = h; window.scrollTo(0, 0);
  };
  el('main').innerHTML = '<div class="vazio"><b>Procurando suas obras…</b></div>'; el('lado').innerHTML = '';
  OBRA = ''; chamar('sisObras').then(function (r) {
    if (r.obras.length === 1 && !forcar && !OBRAS) { OBRAS = r; return abrirObra(r.obras[0].id); }
    desenhar(r);
  }, function (e) { el('main').innerHTML = '<div class="vazio"><b>Não consegui listar as obras</b>' + esc(e && e.message ? e.message : e) + '</div>'; });
}
function formCadastrarObra() {
  abrirGaveta('<header><h2>Cadastrar obra existente</h2><div class="info">Para uma planilha de obra que já existe</div></header><div class="conteudo">' +
    campo('Link da planilha da obra (obrigatório)', '<input id="oLink" placeholder="https://docs.google.com/spreadsheets/d/...">', 'Abra a planilha e copie o endereço lá em cima no navegador. Ela precisa estar no modelo de gerenciamento de obra.') +
    campo('Responsáveis', '<input id="oResp" placeholder="Ex.: Eng. Ana">', 'Só para aparecer na lista. Quem acessa é definido no Compartilhar da planilha.') +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn" onclick="cadastrarObra()">Cadastrar obra</button></footer>');
}
function cadastrarObra() {
  var l = el('oLink').value.trim(); if (!l) return aviso('Cole o link da planilha.');
  chamar('sisObraCadastrar', l, el('oResp').value.trim()).then(function () { fecharGaveta(); aviso('Obra cadastrada.'); vObras(true); }).catch(function () {});
}
function formNovaObra() {
  var semModelo = OBRAS && !OBRAS.temModelo;
  abrirGaveta('<header><h2>Nova obra</h2><div class="info">Copia a planilha Modelo e já deixa pronta para lançar</div></header><div class="conteudo">' +
    (semModelo ? campo('Link da planilha Modelo (só na primeira vez)', '<input id="oMod" placeholder="https://docs.google.com/spreadsheets/d/...">', 'A planilha em branco (Modelo_Gerenciamento_Obra) convertida para Planilhas Google. Fica guardado para as próximas obras.') : '') +
    campo('Nome da obra (obrigatório)', '<input id="oNome" placeholder="Ex.: Residencial Bela Vista">', 'Vai para o Resumo da planilha e para a lista de obras.') +
    campo('E-mails do engenheiro e da equipe', '<textarea id="oMails" placeholder="engenheiro@empresa.com, mestre@empresa.com"></textarea>', 'Recebem acesso de Editor a esta obra (e um e-mail do Google avisando). Separe por vírgula. Você também pode compartilhar depois pela planilha.') +
    '<p class="info">A planilha nova fica no seu Google Drive. Depois de criada, preencha a aba Resumo (datas, orçamento etc.).</p>' +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn" onclick="novaObra()">Criar obra</button></footer>');
}
function novaObra() {
  var nome = el('oNome').value.trim(); if (!nome) return aviso('Escreva o nome da obra.');
  var passo = el('oMod') ? chamar('sisModeloDefinir', el('oMod').value.trim()) : Promise.resolve();
  passo.then(function () { aviso('Criando a obra… pode levar até 1 minuto.', 60000); return chamar('sisObraNova', nome, el('oMails').value); })
    .then(function () { fecharGaveta(); aviso('Obra "' + nome + '" criada.'); vObras(true); }).catch(function () {});
}
function tirarObra(id, nome) {
  if (!confirm('Tirar "' + nome + '" da lista do sistema? A planilha NÃO é apagada e pode ser cadastrada de novo.')) return;
  chamar('sisObraRemover', id).then(function () { aviso('Obra tirada da lista.'); vObras(true); }).catch(function () {});
}

/* ---------------------------------------------------------------- abrir */
(function () {
  var ini = function (p) { if (p && p.obra) abrirObra(p.obra); else vObras(); };
  if (window.google && google.script && google.script.url) google.script.url.getLocation(function (l) { ini(l.parameter); });
  else ini(window.SIS_PARAM || {});
})();
</script>
</body>
</html>
