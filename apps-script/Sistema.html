<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --grafite: #22272b; --grafite2: #2d3439; --grafite3: #3a434a;
    --fundo: #eceeec; --papel: #ffffff; --tinta: #1b2025; --aco: #5d6873; --linha: #d6dadc; --linha2: #e8ebec;
    --azul: #1f3864; --azul2: #2b4a80; --sinal: #f2b705;
    --verm: #b42318; --verm-f: #fdecea; --verde: #2f7d32; --verde-f: #e7f3e8; --ambar: #9a5b00; --ambar-f: #fff3d6; --azul-f: #e7ecf6;
    --titulo: "Barlow Condensed", "Arial Narrow", sans-serif; --texto: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--texto); font-size: 14px; color: var(--tinta); background: var(--fundo); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sinal); outline-offset: 1px; }
  .app { display: grid; grid-template-columns: 252px 1fr; min-height: 100%; }

  .lado { background: var(--grafite); color: #c9d0d5; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .marca { padding: 18px 18px 14px; border-bottom: 1px solid var(--grafite3); }
  .marca b { font-family: var(--titulo); font-size: 22px; font-weight: 700; color: #fff; letter-spacing: .3px; display: block; }
  .marca span { font-size: 12px; color: #9aa5ad; }
  .busca { margin: 12px 14px 4px; }
  .busca input { width: 100%; background: var(--grafite2); border: 1px solid var(--grafite3); border-radius: 6px; padding: 7px 10px; color: #fff; }
  .busca input::placeholder { color: #87929a; }
  .grupo { padding: 10px 0 2px; }
  .grupo > div { font-size: 12px; color: #87929a; padding: 4px 18px; }
  .lado a { display: flex; align-items: center; gap: 8px; padding: 7px 18px 7px 15px; color: #d6dce0; text-decoration: none; border-left: 3px solid transparent; cursor: pointer; font-size: 13.5px; }
  .lado a:hover { background: var(--grafite2); }
  .lado a.on { border-left-color: var(--sinal); background: var(--grafite2); color: #fff; font-weight: 500; }
  .lado a .ct { margin-left: auto; font-size: 11px; background: var(--verm); color: #fff; border-radius: 9px; padding: 0 6px; }
  .lado a.consulta { color: #a8b2b9; }
  .lado .rodape { margin-top: auto; padding: 14px 18px; font-size: 12px; color: #87929a; border-top: 1px solid var(--grafite3); }
  .lado .rodape a { padding: 0; border: 0; display: inline; color: #c9d0d5; text-decoration: underline; }

  .topo-mob { display: none; }
  .app.sem-lado { grid-template-columns: 1fr; } .app.sem-lado .lado, .app.sem-lado .topo-mob button { display: none; }
  .obras { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .obra { background: var(--papel); border: 1px solid var(--linha); border-top: 4px solid var(--azul); display: flex; flex-direction: column; }
  .obra .abre { all: unset; cursor: pointer; padding: 16px 16px 12px; display: block; }
  .obra .abre:focus-visible { outline: 3px solid var(--sinal); }
  .obra .abre b { font-family: var(--titulo); font-size: 22px; font-weight: 600; display: block; color: var(--azul); }
  .obra .abre span { font-size: 12.5px; color: var(--aco); }
  .obra .abre:hover b { text-decoration: underline; }
  .obra .acoes { border-top: 1px solid var(--linha2); padding: 8px 16px; display: flex; gap: 16px; font-size: 12.5px; }
  .obra .acoes a { color: var(--aco); cursor: pointer; text-decoration: underline; }
  main { padding: 22px 28px 60px; min-width: 0; }
  .carimbo { display: grid; grid-template-columns: 1fr auto; border: 1.5px solid var(--tinta); background: var(--papel); margin-bottom: 20px; }
  .carimbo .tit { padding: 14px 18px; border-right: 1.5px solid var(--tinta); }
  .carimbo h1 { font-family: var(--titulo); font-weight: 700; font-size: 32px; line-height: 1; margin: 0 0 6px; letter-spacing: .2px; }
  .carimbo p { margin: 0; color: var(--aco); max-width: 70ch; }
  .carimbo .cel { display: grid; grid-template-columns: repeat(2, minmax(120px, auto)); }
  .carimbo .cel div { padding: 7px 12px; border-bottom: 1px solid var(--linha); border-left: 1px solid var(--linha); font-size: 13px; }
  .carimbo .cel div:nth-child(odd) { border-left: 0; }
  .carimbo .cel div:nth-last-child(-n+2) { border-bottom: 0; }
  .carimbo .cel small { display: block; font-size: 11px; color: var(--aco); }
  .corpo { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 22px; align-items: start; }
  .corpo.sem-guia { grid-template-columns: minmax(0, 1fr); }
  .guia { background: var(--papel); border-top: 4px solid var(--sinal); padding: 14px 16px; position: sticky; top: 16px; font-size: 13px; }
  .guia h2 { font-family: var(--titulo); font-size: 20px; margin: 0; font-weight: 600; display: inline; }
  .guia summary { cursor: pointer; margin-bottom: 8px; list-style-position: outside; }
  .guia:not([open]) summary { margin-bottom: 0; }
  .guia .qd { color: var(--aco); margin: 0 0 10px; }
  .guia ol { margin: 0; padding-left: 20px; }
  .guia li { margin-bottom: 7px; }
  .guia .leg { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--linha2); color: var(--aco); font-size: 12px; }
  .barra { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .barra .esp { flex: 1; }
  .barra input[type=search] { width: 260px; max-width: 100%; }
  .btn { border: 1px solid var(--azul); background: var(--azul); color: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--azul2); }
  .btn.sec { background: var(--papel); color: var(--azul); border-color: var(--linha); }
  .btn.sec:hover { border-color: var(--azul); }
  .btn.perigo { background: var(--papel); color: var(--verm); border-color: var(--linha); }
  .btn.peq { padding: 4px 9px; font-size: 12px; }
  input, select, textarea { border: 1px solid #c4cacf; border-radius: 6px; padding: 8px 10px; background: #fff; width: 100%; }
  textarea { min-height: 76px; resize: vertical; }
  .info { color: var(--aco); font-size: 12px; }

  .tabela { background: var(--papel); border: 1px solid var(--linha); overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; background: #f4f5f6; text-align: left; font-weight: 600; font-size: 12px; color: var(--aco); padding: 8px 10px; border-bottom: 1.5px solid var(--tinta); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--linha2); vertical-align: top; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #f7f8fa; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mais { padding: 10px; text-align: center; }
  .vazio { background: var(--papel); border: 1px dashed #b9c0c5; padding: 28px; text-align: center; color: var(--aco); }
  .vazio b { display: block; color: var(--tinta); font-size: 15px; margin-bottom: 6px; }
  .st { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 3px; background: #eef0f2; color: #3d464d; white-space: nowrap; }
  .st.verm { background: var(--verm-f); color: var(--verm); } .st.verde { background: var(--verde-f); color: var(--verde); }
  .st.ambar { background: var(--ambar-f); color: var(--ambar); } .st.azul { background: var(--azul-f); color: var(--azul); }

  .fundo-gaveta { position: fixed; inset: 0; background: rgba(27,32,37,.42); display: none; z-index: 40; }
  .gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--papel); z-index: 41; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; visibility: hidden; }
  .aberta .fundo-gaveta { display: block; } .aberta .gaveta { transform: none; visibility: visible; }
  .gaveta header { padding: 16px 20px; border-bottom: 1.5px solid var(--tinta); }
  .gaveta header h2 { font-family: var(--titulo); font-size: 26px; margin: 0; font-weight: 700; }
  .gaveta header .info { margin-top: 3px; }
  .gaveta .conteudo { padding: 16px 20px; overflow-y: auto; flex: 1; }
  .gaveta footer { padding: 12px 20px; border-top: 1px solid var(--linha); display: flex; gap: 8px; align-items: center; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-weight: 500; font-size: 13px; margin-bottom: 4px; }
  .campo .aj { font-size: 12px; color: var(--aco); margin-top: 4px; line-height: 1.4; }
  .secao { font-family: var(--titulo); font-size: 18px; font-weight: 600; margin: 20px 0 10px; padding-top: 12px; border-top: 1px solid var(--linha); }
  .secao small { font-family: var(--texto); font-size: 12px; font-weight: 400; color: var(--aco); display: block; }
  .auto { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
  .auto span:nth-child(odd) { color: var(--aco); } .auto span:nth-child(even) { text-align: right; font-weight: 500; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  .faixa { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--linha); background: var(--papel); margin-bottom: 12px; }
  .faixa div { padding: 14px 16px; border-left: 1px solid var(--linha); }
  .faixa div:first-child { border-left: 0; }
  .faixa b { display: block; font-family: var(--titulo); font-size: 30px; font-weight: 600; line-height: 1.05; }
  .faixa span { color: var(--aco); font-size: 12px; }
  .bloco h2 { font-family: var(--titulo); font-size: 22px; font-weight: 600; margin: 0 0 10px; }
  .pend { background: var(--papel); border: 1px solid var(--linha); }
  .pend a { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--linha2); color: inherit; text-decoration: none; cursor: pointer; }
  .pend a:last-child { border-bottom: 0; }
  .pend a:hover { background: #f7f8fa; }
  .pend .q { margin-left: auto; min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 3px; background: var(--verde-f); color: var(--verde); }
  .pend .q.alto { background: var(--verm-f); color: var(--verm); }
  .atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .duas-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; margin-top: 10px; }

  .quadro { display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; }
  .coluna { background: #e2e5e4; padding: 10px; min-height: 240px; }
  .coluna h3 { margin: 0 0 10px; font-family: var(--titulo); font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; }
  .cartao { background: var(--papel); padding: 10px 11px; margin-bottom: 8px; border-left: 4px solid #98a2b3; cursor: pointer; }
  .cartao.Alta { border-left-color: var(--verm); } .cartao.Média { border-left-color: var(--sinal); }
  .cartao .t { font-weight: 600; margin-bottom: 6px; }
  .cartao .m { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--aco); }
  .cartao .mv { display: flex; gap: 6px; margin-top: 8px; }

  .nota { color: #b07800; letter-spacing: 1px; }
  .abas { display: flex; border-bottom: 1.5px solid var(--tinta); margin: -4px 0 14px; }
  .abas button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--aco); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
  .abas button.on { color: var(--tinta); border-bottom-color: var(--sinal); font-weight: 600; }
  .hist { white-space: pre-line; font-size: 12px; color: var(--aco); background: #f4f5f6; padding: 10px; max-height: 150px; overflow: auto; }

  .pres td { vertical-align: middle; }
  .seg { display: inline-flex; border: 1px solid var(--linha); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-left: 1px solid var(--linha); background: #fff; padding: 7px 13px; cursor: pointer; font-weight: 600; min-width: 40px; }
  .seg button:first-child { border-left: 0; }
  .seg button.on.P { background: var(--verde); color: #fff; } .seg button.on.F { background: var(--verm); color: #fff; }
  .seg button.on.m { background: var(--sinal); } .seg button.on.A { background: var(--azul); color: #fff; }

  .aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: #fff; padding: 10px 16px; border-radius: 6px; display: none; z-index: 60; max-width: 90vw; }
  .carregando { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--sinal); transform-origin: left; animation: barra 1.1s ease-in-out infinite; display: none; z-index: 70; }
  @keyframes barra { 0% { transform: scaleX(.05); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .gaveta { transition: none; } .carregando { animation: none; } }

  @media (max-width: 1100px) { .corpo { grid-template-columns: minmax(0, 1fr); } .guia { position: static; order: -1; } .duas-col { grid-template-columns: 1fr; } }
  .so-mob { display: none; }
  @media (max-width: 560px) { .nao-mob { display: none; } .so-mob { display: inline; } .seg button { padding: 9px 11px; min-width: 38px; } }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .lado { position: fixed; z-index: 50; width: 270px; transform: translateX(-100%); transition: transform .2s; }
    .menu-aberto .lado { transform: none; }
    .topo-mob { display: flex; align-items: center; gap: 10px; background: var(--grafite); color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 30; }
    .topo-mob b { font-family: var(--titulo); font-size: 20px; }
    .topo-mob button { background: none; border: 1px solid var(--grafite3); color: #fff; border-radius: 6px; padding: 5px 10px; }
    main { padding: 14px 12px 60px; }
    .carimbo { grid-template-columns: 1fr; } .carimbo .tit { border-right: 0; border-bottom: 1.5px solid var(--tinta); }
    .carimbo h1 { font-size: 27px; }
    .faixa { grid-template-columns: 1fr 1fr; } .faixa div:nth-child(3) { border-left: 0; } .faixa div:nth-child(n+3) { border-top: 1px solid var(--linha); }
    .quadro { grid-template-columns: repeat(4, 84vw); }
    .duas { grid-template-columns: 1fr; }
    .barra input[type=search], .barra select { width: 100% !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lado" id="lado"></aside>
  <div>
    <div class="topo-mob"><button onclick="menuMob()" aria-label="Abrir menu">☰ Menu</button><b>Sistema de Obras</b></div>
    <main id="main"><div class="vazio"><b>Abrindo a planilha da obra…</b>Isso leva alguns segundos na primeira vez.</div></main>
  </div>
</div>
<div class="fundo-gaveta" onclick="fecharGaveta()"></div>
<div class="gaveta" id="gaveta" role="dialog" aria-modal="true"></div>
<div class="aviso" id="aviso" role="status"></div>
<div class="carregando" id="carregando"></div>

<script>
var OBRA = '', OBRAS = null, D = null, CFG = null, ATUAL = 'inicio', CACHE = {}, BUSCA = {}, LIMITE = {}, FILTRO = { resp: '', fTipo: '' }, ABA_F = 'dados', PRES = null;
var ORIGENS = ['Chefe / diretoria', 'Projetista', 'Cliente', 'Vizinho', 'Fornecedor', 'Órgão público', 'Equipe da obra', 'Outro'];
var TIPOS_FORN = ['Fornecedor', 'Empreiteiro / prestador', 'Projetista', 'Órgão / concessionária', 'Locadora'];
var TIPOS_INT = ['Ligação', 'WhatsApp', 'E-mail', 'Visita', 'Reunião', 'Cotação', 'Cobrança', 'Outro'];
var PEND_MOD = [['boleto', 'lancamentos'], ['financeiro', 'lancamentos'], ['diário', 'diario'], ['presença', 'presenca'], ['planejamento', 'planejamento'],
  ['compras', 'compras'], ['cotaç', 'cotacoes'], ['mediç', 'medicoes'], ['equipamento', 'equipamentos'], ['inspeç', 'inspecoes'], ['fvs', 'fvs'],
  ['apartamento', 'vaptos'], ['loja', 'vlojas'], ['cronograma', 'cronograma'], ['estrutura', 'estrutura'], ['vizinho', 'monitoramento'], ['orçamento', 'analitico']];

/* ---------------------------------------------------------------- servidor */
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, erro) {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro).sisChamar(OBRA, fn, args);
    } else if (window.SIS_MOCK) setTimeout(function () { try { ok(window.SIS_MOCK(fn, args)); } catch (e) { erro(e); } }, 120);
    else erro(new Error('Abra o sistema pelo link do Google (Apps Script).'));
  });
}
function ocupado(on) { el('carregando').style.display = on ? 'block' : 'none'; }
function chamar() {
  ocupado(true);
  return api.apply(null, arguments).then(function (r) { ocupado(false); return r; }, function (e) { ocupado(false); aviso('Não foi possível concluir: ' + (e && e.message ? e.message : e), 7000); throw e; });
}

/* ---------------------------------------------------------------- utilidades */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function aviso(t, ms) { var x = el('aviso'); x.textContent = t; x.style.display = 'block'; clearTimeout(aviso.h); aviso.h = setTimeout(function () { x.style.display = 'none'; }, ms || 2600); }
function hoje() { return D ? D.hoje : new Date().toISOString().slice(0, 10); }
function dias(iso) { if (!iso) return null; return Math.round((new Date(String(iso).slice(0, 10) + 'T12:00:00') - new Date(hoje() + 'T12:00:00')) / 864e5); }
function br(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
function brCurta(iso) { var b = br(iso); return b.length === 10 ? b.slice(0, 6) + b.slice(8) : b; }
function rs(v) { return v == null || v === '' ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 0 }); }
function chave(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function opts(lista, sel, vazio) { return (vazio != null ? '<option value="">' + esc(vazio) + '</option>' : '') + lista.map(function (o) { return '<option' + (String(o) === String(sel) ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
function mod(id) { return CFG.modulos.filter(function (m) { return m.id === id; })[0]; }
function manterFoco(sel) { setTimeout(function () { var x = document.querySelector(sel); if (x) { x.focus(); x.setSelectionRange(x.value.length, x.value.length); } }); }
function prazoTag(iso, feito) {
  if (!iso) return '';
  var d = dias(iso);
  if (feito) return '<span class="st">' + brCurta(iso) + '</span>';
  if (d < 0) return '<span class="st verm">atrasada ' + (-d) + ' d</span>';
  if (d === 0) return '<span class="st ambar">vence hoje</span>';
  if (d <= 3) return '<span class="st ambar">' + brCurta(iso) + '</span>';
  return '<span class="st">' + brCurta(iso) + '</span>';
}
function stTag(t) {
  var s = chave(t); if (!s) return '';
  var c = /atras|vencid|reprov|crític|urg|não conform|^nc$|pendência venc|alerta|desligado|não contratar/.test(s) ? 'verm' :
          /aberto|aguard|pendênc|em vistoria|incomplet|atenção|a pagar|pedir|andamento/.test(s) ? 'ambar' :
          /aprov|liberad|conclu|pago|^ok|entreg|fechad|fechou|^ativo|corrigid|^c$|^s$|no prazo/.test(s) ? 'verde' : '';
  return '<span class="st ' + c + '">' + esc(t) + '</span>';
}

/* ---------------------------------------------------------------- menu */
function montarMenu() {
  var q = chave(el('buscaMenu') ? el('buscaMenu').value : '');
  var p = pend(), cont = { demandas: p.atras.length, fornecedores: p.seg.length };
  var h = '<div class="marca"><b>Sistema de Obras</b><span>' + esc(D.obra) + '</span></div>' +
    '<div class="busca"><input id="buscaMenu" type="search" placeholder="Procurar tela…" aria-label="Procurar tela" value="' + esc(q) + '" oninput="montarMenu();manterFoco(\'#buscaMenu\')"></div>' +
    '<div class="grupo"><a class="' + (ATUAL === 'inicio' ? 'on' : '') + '" onclick="ir(\'inicio\')">Início</a></div>';
  CFG.grupos.forEach(function (g) {
    var ms = CFG.modulos.filter(function (m) { return m.grupo === g.id && (!q || chave(m.titulo + ' ' + m.serve).indexOf(q) >= 0); });
    if (!ms.length) return;
    h += '<div class="grupo"><div>' + esc(g.nome) + '</div>' + ms.map(function (m) {

  abrirGaveta('<header><h2>' + (id ? 'Demanda' : 'Nova demanda') + '</h2><div class="info">' + (id ? esc(d.Status) : 'Grava na aba CRM Demandas da planilha') + '</div></header><div class="conteudo">' +
    campo('O que precisa ser feito (obrigatório)', '<input id="fTit" value="' + esc(d['Título']) + '">', 'Uma frase curta e clara. Ex.: "Pedir a prancha PL01 R02 ao arquiteto".') +
    campo('Detalhes', '<textarea id="fDesc">' + esc(d['Descrição']) + '</textarea>', 'Contexto, links, nº de protocolo.') +
    '<div class="duas">' + campo('Quem pediu', '<input id="fSol" value="' + esc(d.Solicitante) + '">') + campo('Origem', '<select id="fOri">' + opts(ORIGENS, d.Origem, '') + '</select>') +
    campo('Responsável', '<input id="fResp" list="lResp" value="' + esc(d['Responsável']) + '"><datalist id="lResp">' + nomes.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>', 'Quem vai resolver.') +
    campo('Prazo', '<input id="fPrazo" type="date" value="' + esc(String(d.Prazo || '').slice(0, 10)) + '">', 'Aparece no Início quando faltarem 3 dias.') +
    campo('Prioridade', '<select id="fPri">' + opts(['Alta', 'Média', 'Baixa'], d.Prioridade) + '</select>') + campo('Situação', '<select id="fSt">' + opts(D.status, d.Status) + '</select>') + '</div>' +
    campo('Obra', '<input id="fObra" value="' + esc(d.Obra || D.obra) + '">') +
    (d['Histórico'] ? '<div class="secao">Histórico</div><div class="hist">' + esc(d['Histórico']) + '</div>' : '') +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn" onclick="gravarDem(\'' + esc(d.ID || '') + '\')">Salvar demanda</button></footer>');
}
function gravarDem(id) {
  var d = Object.assign({}, id ? acharDem(id) : {}, { ID: id || '', 'Título': el('fTit').value.trim(), 'Descrição': el('fDesc').value.trim(), Solicitante: el('fSol').value.trim(),
    Origem: el('fOri').value, 'Responsável': el('fResp').value.trim(), Prazo: el('fPrazo').value, Prioridade: el('fPri').value, Status: el('fSt').value, Obra: el('fObra').value.trim() });
  if (!d['Título']) { aviso('Escreva o que precisa ser feito.'); return; }
  salvarCRM('sisSalvarDemanda', d, 'Demanda salva.');
}

/* ---------------------------------------------------------------- fornecedores */
function hist(f) { return (D.historico && D.historico[chave(f.Nome)]) || { cotacoes: [], contratos: [], medicoes: [], lancamentos: [], compras: [], servicos: [] }; }
function soma(l, k) { return l.reduce(function (a, x) { return a + (Number(x[k]) || 0); }, 0); }
function notaMedia(f) { var v = ['Nota prazo', 'Nota qualidade', 'Nota preço'].map(function (k) { return Number(f[k]) || 0; }).filter(Boolean); return v.length ? v.reduce(function (a, b) { return a + b; }, 0) / v.length : 0; }
function estrelas(n) { n = Math.round(n || 0); return n ? '<span class="nota" aria-label="' + n + ' de 5">' + '★'.repeat(n) + '☆'.repeat(5 - n) + '</span>' : '<span class="info">sem nota</span>'; }
function vFornecedores(m) { el('main').innerHTML = carimbo(m.titulo, m.serve, ['Aba da planilha', 'CRM Fornecedores']) + '<div class="corpo"><div id="area"></div>' + guia(m, false) + '</div>'; desenharFornecedores(); }
function desenharFornecedores() {
  var q = chave(BUSCA.forn || ''), t = FILTRO.fTipo;
  var fs = D.fornecedores.filter(function (f) { return (!q || chave(f.Nome + ' ' + f['Categoria / serviço'] + ' ' + f.Contato).indexOf(q) >= 0) && (!t || f.Tipo === t); })
    .sort(function (a, b) { return String(a.Nome).localeCompare(String(b.Nome)); });
  var sem = Object.keys(D.historico || {}).filter(function (k) { return !D.fornecedores.some(function (f) { return chave(f.Nome) === k; }); });
  var h = '<div class="barra"><input type="search" id="buscaForn" aria-label="Buscar fornecedor" placeholder="Buscar nome ou serviço…" value="' + esc(BUSCA.forn || '') + '" oninput="BUSCA.forn=this.value;desenharFornecedores();manterFoco(\'#buscaForn\')">' +
    '<select style="width:220px" aria-label="Tipo" onchange="FILTRO.fTipo=this.value;desenharFornecedores()">' + opts(TIPOS_FORN, FILTRO.fTipo, 'Todos os tipos') + '</select><span class="esp"></span>' +
    '<button class="btn" onclick="abrirForn()">+ Novo cadastro</button></div>';
  if (sem.length) h += '<div class="pend" style="margin-bottom:12px"><a onclick="importar()"><span><b>' + sem.length + ' nome(s) já aparecem na planilha e não estão no cadastro</b><br><span class="info">' +
    esc(sem.slice(0, 6).map(function (k) { return D.historico[k].nome; }).join(', ')) + (sem.length > 6 ? '…' : '') + '</span></span><span class="btn peq" style="margin-left:auto">Importar todos</span></a></div>';
  if (!fs.length) { el('area').innerHTML = h + '<div class="vazio"><b>Nenhum cadastro ainda</b>Use "Importar todos" ou "+ Novo cadastro".</div>'; return; }
  h += '<div class="tabela"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Serviço</th><th>Avaliação</th><th>Cotações</th><th>Contratado</th><th>Próximo retorno</th></tr></thead><tbody>' + fs.map(function (f) {
    var x = hist(f), seg = D.interacoes.filter(function (i) { return i['Fornecedor ID'] === f.ID && i['Data do próximo passo'] && String(i['Feito?']).toUpperCase() !== 'SIM'; })
      .sort(function (a, b) { return a['Data do próximo passo'].localeCompare(b['Data do próximo passo']); })[0];
    return '<tr tabindex="0" onkeydown="if(event.key===\'Enter\')this.click()" onclick="abrirForn(\'' + esc(f.ID) + '\')"><td><b>' + esc(f.Nome) + '</b>' + (f['Situação'] && f['Situação'] !== 'Ativo' ? ' ' + stTag(f['Situação']) : '') + '</td><td>' + esc(f.Tipo) + '</td><td>' + esc(f['Categoria / serviço']) +
      '</td><td>' + estrelas(notaMedia(f)) + '</td><td class="num">' + x.cotacoes.length + ' (' + x.cotacoes.filter(function (c) { return c.escolhido; }).length + ' fechadas)</td><td class="num">' + rs(soma(x.contratos, 'valor') || null) +
      '</td><td>' + (seg ? esc(seg['Próximo passo'] || 'retorno') + ' ' + prazoTag(seg['Data do próximo passo']) : '') + '</td></tr>';
  }).join('') + '</tbody></table></div>';
  el('area').innerHTML = h;
}
function importar() { chamar('sisImportarFornecedores', null).then(function (r) { D = r; montarMenu(); desenharFornecedores(); aviso((r.importados || 0) + ' cadastro(s) importado(s).'); }); }
function acharForn(id) { return D.fornecedores.filter(function (f) { return f.ID === id; })[0]; }
function abrirForn(id, aba) {
  var f = id ? acharForn(id) : { Tipo: 'Fornecedor', 'Situação': 'Ativo' }; ABA_F = id ? (aba || 'dados') : 'dados';
  var x = id ? hist(f) : null, ints = id ? D.interacoes.filter(function (i) { return i['Fornecedor ID'] === id; }).sort(function (a, b) { return String(b.Data).localeCompare(String(a.Data)); }) : [];
  var h = '<header><h2>' + esc(f.Nome || 'Novo cadastro') + '</h2><div class="info">' + esc([f.Tipo, f['Categoria / serviço']].filter(Boolean).join(', ')) + '</div></header><div class="conteudo">';
  if (id) h += '<div class="abas">' + [['dados', 'Cadastro'], ['contatos', 'Contatos (' + ints.length + ')'], ['obra', 'Na obra (' + (x.cotacoes.length + x.contratos.length + x.medicoes.length + x.lancamentos.length + x.compras.length) + ')']]
    .map(function (a) { return '<button class="' + (ABA_F === a[0] ? 'on' : '') + '" onclick="abrirForn(\'' + esc(id) + '\',\'' + a[0] + '\')">' + a[1] + '</button>'; }).join('') + '</div>';
  var rod = '<span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Fechar</button>';
  if (ABA_F === 'dados') {
    h += campo('Nome / razão social (obrigatório)', '<input id="nNome" value="' + esc(f.Nome) + '">', 'Escreva igual ao usado nas Cotações, Contratos e Lançamentos: é assim que o histórico é encontrado.') +
      '<div class="duas">' + campo('Tipo', '<select id="nTipo">' + opts(TIPOS_FORN, f.Tipo) + '</select>') + campo('Serviço / material', '<input id="nCat" value="' + esc(f['Categoria / serviço']) + '">') +
      campo('Pessoa de contato', '<input id="nCont" value="' + esc(f.Contato) + '">') + campo('Telefone / WhatsApp', '<input id="nTel" value="' + esc(f.Telefone) + '">') +
      campo('E-mail', '<input id="nMail" value="' + esc(f['E-mail']) + '">') + campo('CNPJ / CPF', '<input id="nDoc" value="' + esc(f['CNPJ / CPF']) + '">') +
      campo('Cidade', '<input id="nCid" value="' + esc(f.Cidade) + '">') + campo('Situação', '<select id="nSit">' + opts(['Ativo', 'Em avaliação', 'Não contratar'], f['Situação']) + '</select>') + '</div>' +
      '<div class="secao">Avaliação<small>1 = ruim, 5 = ótimo. Preencha ao fim de cada serviço.</small></div><div class="duas">' +
      ['Nota prazo', 'Nota qualidade', 'Nota preço'].map(function (k, i) { return campo(['Cumpre prazo', 'Qualidade', 'Preço'][i], '<select id="nN' + i + '">' + opts(['', '1', '2', '3', '4', '5'], String(f[k] || '')) + '</select>'); }).join('') + '</div>' +
      campo('Observações', '<textarea id="nObs">' + esc(f['Observações']) + '</textarea>');
    rod = (f.Telefone ? '<a class="btn sec" target="_blank" href="https://wa.me/55' + esc(String(f.Telefone).replace(/\D/g, '').replace(/^55/, '')) + '">Abrir WhatsApp</a>' : '') + rod +
      '<button class="btn" onclick="gravarForn(\'' + esc(f.ID || '') + '\')">Salvar cadastro</button>';
  } else if (ABA_F === 'contatos') {
    h += '<div class="duas">' + campo('Tipo de contato', '<select id="iTipo">' + opts(TIPOS_INT, 'WhatsApp') + '</select>') + campo('Data', '<input id="iData" type="date" value="' + hoje() + '">') + '</div>' +
      campo('O que foi conversado (obrigatório)', '<textarea id="iRes" placeholder="Ex.: pediu até sexta para mandar a proposta"></textarea>') +
      '<div class="duas">' + campo('Próximo passo', '<input id="iProx" placeholder="Ex.: cobrar a proposta">') + campo('Até quando', '<input id="iProxD" type="date">', 'Aparece no Início nesse dia.') + '</div>' +
      '<button class="btn" onclick="gravarInt(\'' + esc(id) + '\')">Registrar contato</button>';
    if (ints.length) h += '<div class="secao">Histórico</div><div class="tabela"><table><tbody>' + ints.map(function (i) {
      var pd = i['Data do próximo passo'] && String(i['Feito?']).toUpperCase() !== 'SIM';
      return '<tr style="cursor:default"><td style="white-space:nowrap">' + br(i.Data) + '<div class="info">' + esc(i.Tipo) + '</div></td><td>' + esc(i.Resumo) +
        (i['Próximo passo'] ? '<div class="info">Próximo: ' + esc(i['Próximo passo']) + ' ' + prazoTag(i['Data do próximo passo'], !pd) + '</div>' : '') + '</td><td>' +
        (pd ? '<button class="btn sec peq" onclick="feito(\'' + esc(i.ID) + '\')">Marcar como feito</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>';
  } else {
    var tab = function (t, l, c) { return l.length ? '<div class="secao">' + esc(t) + ' (' + l.length + ')</div><div class="tabela"><table><thead><tr>' + c.map(function (k) { return '<th>' + esc(k[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      l.map(function (r) { return '<tr style="cursor:default">' + c.map(function (k) { var v = r[k[1]]; return '<td class="' + (k[3] ? 'num' : '') + '">' + (k[2] ? k[2](v) : esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' : ''; };
    h += tab('Cotações', x.cotacoes, [['Nº', 'n'], ['Data', 'data', brCurta], ['Serviço', 'servico'], ['Valor', 'valor', rs, 1], ['', 'escolhido', function (v) { return v ? stTag('fechou') : ''; }]]) +
      tab('Contratos', x.contratos, [['Nº', 'n'], ['Serviço', 'servico'], ['Valor', 'valor', rs, 1], ['Medido', 'medido', rs, 1]]) +
      tab('Medições', x.medicoes, [['Data', 'data', brCurta], ['Contrato', 'contrato'], ['Líquido', 'liquido', rs, 1], ['', 'pago', function (v) { return v ? stTag('pago') : stTag('a pagar'); }]]) +
      tab('Notas e boletos', x.lancamentos, [['Venc.', 'vencimento', brCurta], ['Descrição', 'descricao'], ['Valor', 'valor', rs, 1], ['Situação', 'status', stTag]]) +
      tab('Compras', x.compras, [['Material', 'material'], ['Previsto', 'prevista', brCurta], ['Entregue', 'real', brCurta], ['Situação', 'status', stTag]]);
    if (!(x.cotacoes.length + x.contratos.length + x.medicoes.length + x.lancamentos.length + x.compras.length)) h += '<div class="vazio"><b>Esse nome ainda não aparece na planilha</b>Confira se está escrito igual nas Cotações, Contratos, Lançamentos ou Compras.</div>';
  }
  abrirGaveta(h + '</div><footer>' + rod + '</footer>');
}
function gravarForn(id) {
  var f = Object.assign({}, id ? acharForn(id) : {}, { ID: id || '', Nome: el('nNome').value.trim(), Tipo: el('nTipo').value, 'Categoria / serviço': el('nCat').value.trim(), Contato: el('nCont').value.trim(),
    Telefone: el('nTel').value.trim(), 'E-mail': el('nMail').value.trim(), 'CNPJ / CPF': el('nDoc').value.trim(), Cidade: el('nCid').value.trim(), 'Situação': el('nSit').value,
    'Nota prazo': el('nN0').value, 'Nota qualidade': el('nN1').value, 'Nota preço': el('nN2').value, 'Observações': el('nObs').value.trim() });
  if (!f.Nome) { aviso('Preencha o nome.'); return; }
  salvarCRM('sisSalvarFornecedor', f, 'Cadastro salvo.');
}
function gravarInt(fid) {
  var f = acharForn(fid), i = { 'Fornecedor ID': fid, Fornecedor: f.Nome, Tipo: el('iTipo').value, Data: el('iData').value, Resumo: el('iRes').value.trim(), 'Próximo passo': el('iProx').value.trim(), 'Data do próximo passo': el('iProxD').value, 'Feito?': '' };
  if (!i.Resumo) { aviso('Escreva o que foi conversado.'); return; }
  salvarCRM('sisSalvarInteracao', i, 'Contato registrado.').then(function () { abrirForn(fid, 'contatos'); });
}
function feito(iid) { var i = Object.assign({}, D.interacoes.filter(function (x) { return x.ID === iid; })[0], { 'Feito?': 'SIM' }); salvarCRM('sisSalvarInteracao', i, 'Marcado como feito.').then(function () { abrirForn(i['Fornecedor ID'], 'contatos'); }); }

/* ---------------------------------------------------------------- gaveta */
function abrirGaveta(h) { el('gaveta').innerHTML = h; document.body.classList.add('aberta'); var f = el('gaveta').querySelector('input,select,textarea'); if (f) setTimeout(function () { f.focus(); }, 230); }
function fecharGaveta() { document.body.classList.remove('aberta'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharGaveta(); });

/* ---------------------------------------------------------------- obras */
function urlObra(id) { if (window.google && google.script && google.script.history) google.script.history.replace(null, id ? { obra: id } : {}); }
function abrirObra(id) {
  OBRA = id; D = null; CFG = null; CACHE = {}; BUSCA = {}; LIMITE = {}; ATUAL = 'inicio'; urlObra(id);
  el('app').classList.remove('sem-lado');
  el('lado').innerHTML = ''; el('main').innerHTML = '<div class="vazio"><b>Abrindo a planilha da obra…</b>Isso leva alguns segundos.</div>';
  chamar('sisCarregar').then(function (r) { D = r; CFG = r.config; montarMenu(); ir('inicio'); }, function (e) {
    el('main').innerHTML = '<div class="vazio"><b>Não consegui abrir esta obra</b>' + esc(e && e.message ? e.message : e) + '<br><br><button class="btn" onclick="vObras()">Escolher outra obra</button></div>';
  });
}
function vObras(forcar) {
  fecharGaveta(); el('app').classList.add('sem-lado'); el('app').classList.remove('menu-aberto'); urlObra('');
  var desenhar = function (r) {
    OBRAS = r;
    var h = '<section class="carimbo"><div class="tit"><h1>Suas obras</h1><p>Escolha a obra para abrir. Aparecem só as obras cujas planilhas foram compartilhadas com você.</p></div><div class="cel">' +
      '<div><small>Usuário</small>' + esc(r.usuario) + '</div><div><small>Obras com acesso</small>' + r.obras.length + ' de ' + r.total + '</div></div></section>' +
      '<div class="corpo"><div><div class="barra"><span class="esp"></span><button class="btn sec" onclick="formCadastrarObra()">Cadastrar obra existente</button>' +
      '<button class="btn" onclick="formNovaObra()">+ Nova obra a partir do modelo</button></div>';
    h += r.obras.length ? '<div class="obras">' + r.obras.map(function (o) {
      return '<div class="obra"><button class="abre" onclick="abrirObra(\'' + esc(o.id) + '\')"><b>' + esc(o.nome) + '</b><span>' + (o.resp ? 'Responsáveis: ' + esc(o.resp) : 'Abrir o sistema desta obra') + '</span></button>' +
        '<div class="acoes"><a href="' + esc(o.url) + '" target="_blank">Planilha</a><a onclick="tirarObra(\'' + esc(o.id) + '\',\'' + esc(o.nome).replace(/'/g, '') + '\')">Tirar da lista</a></div></div>';
    }).join('') + '</div>' : '<div class="vazio"><b>Nenhuma obra liberada para você ainda</b>Peça ao responsável para compartilhar a planilha da obra com o seu e-mail (como Editor), ou cadastre uma obra.</div>';
    h += '</div><details class="guia"' + (window.innerWidth > 820 ? ' open' : '') + '><summary><h2>Como funciona</h2></summary><ol>' +
      '<li>Cada obra é uma planilha, copiada do Modelo.</li>' +
      '<li>Quem vê cada obra é decidido no <b>Compartilhar</b> da planilha: dê acesso de <b>Editor</b> só ao engenheiro e à equipe daquela obra.</li>' +
      '<li>A diretoria recebe acesso a todas e vê todas aqui.</li>' +
      '<li>"Nova obra" copia o Modelo para o seu Drive, já com o nome, e compartilha com os e-mails que você informar.</li>' +
      '<li>"Tirar da lista" não apaga a planilha.</li></ol>' +
      (r.temModelo ? '' : '<div class="leg">Para criar obras novas, primeiro informe o link da planilha Modelo em "+ Nova obra".</div>') + '</details></div>';
    el('main').innerHTML = h; window.scrollTo(0, 0);
  };
  el('main').innerHTML = '<div class="vazio"><b>Procurando suas obras…</b></div>'; el('lado').innerHTML = '';
  OBRA = ''; chamar('sisObras').then(function (r) {
    if (r.obras.length === 1 && !forcar && !OBRAS) { OBRAS = r; return abrirObra(r.obras[0].id); }
    desenhar(r);
  }, function (e) { el('main').innerHTML = '<div class="vazio"><b>Não consegui listar as obras</b>' + esc(e && e.message ? e.message : e) + '</div>'; });
}
function formCadastrarObra() {
  abrirGaveta('<header><h2>Cadastrar obra existente</h2><div class="info">Para uma planilha de obra que já existe</div></header><div class="conteudo">' +
    campo('Link da planilha da obra (obrigatório)', '<input id="oLink" placeholder="https://docs.google.com/spreadsheets/d/...">', 'Abra a planilha e copie o endereço lá em cima no navegador. Ela precisa estar no modelo de gerenciamento de obra.') +
    campo('Responsáveis', '<input id="oResp" placeholder="Ex.: Eng. Ana">', 'Só para aparecer na lista. Quem acessa é definido no Compartilhar da planilha.') +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn" onclick="cadastrarObra()">Cadastrar obra</button></footer>');
}
function cadastrarObra() {
  var l = el('oLink').value.trim(); if (!l) return aviso('Cole o link da planilha.');
  chamar('sisObraCadastrar', l, el('oResp').value.trim()).then(function () { fecharGaveta(); aviso('Obra cadastrada.'); vObras(true); }).catch(function () {});
}
function formNovaObra() {
  var semModelo = OBRAS && !OBRAS.temModelo;
  abrirGaveta('<header><h2>Nova obra</h2><div class="info">Copia a planilha Modelo e já deixa pronta para lançar</div></header><div class="conteudo">' +
    (semModelo ? campo('Link da planilha Modelo (só na primeira vez)', '<input id="oMod" placeholder="https://docs.google.com/spreadsheets/d/...">', 'A planilha em branco (Modelo_Gerenciamento_Obra) convertida para Planilhas Google. Fica guardado para as próximas obras.') : '') +
    campo('Nome da obra (obrigatório)', '<input id="oNome" placeholder="Ex.: Residencial Bela Vista">', 'Vai para o Resumo da planilha e para a lista de obras.') +
    campo('E-mails do engenheiro e da equipe', '<textarea id="oMails" placeholder="engenheiro@empresa.com, mestre@empresa.com"></textarea>', 'Recebem acesso de Editor a esta obra (e um e-mail do Google avisando). Separe por vírgula. Você também pode compartilhar depois pela planilha.') +
    '<p class="info">A planilha nova fica no seu Google Drive. Depois de criada, preencha a aba Resumo (datas, orçamento etc.).</p>' +
    '</div><footer><span style="flex:1"></span><button class="btn sec" onclick="fecharGaveta()">Cancelar</button><button class="btn" onclick="novaObra()">Criar obra</button></footer>');
}
function novaObra() {
  var nome = el('oNome').value.trim(); if (!nome) return aviso('Escreva o nome da obra.');
  var passo = el('oMod') ? chamar('sisModeloDefinir', el('oMod').value.trim()) : Promise.resolve();
  passo.then(function () { aviso('Criando a obra… pode levar até 1 minuto.', 60000); return chamar('sisObraNova', nome, el('oMails').value); })
    .then(function () { fecharGaveta(); aviso('Obra "' + nome + '" criada.'); vObras(true); }).catch(function () {});
}
function tirarObra(id, nome) {
  if (!confirm('Tirar "' + nome + '" da lista do sistema? A planilha NÃO é apagada e pode ser cadastrada de novo.')) return;
  chamar('sisObraRemover', id).then(function () { aviso('Obra tirada da lista.'); vObras(true); }).catch(function () {});
}

/* ---------------------------------------------------------------- abrir */
(function () {
  var ini = function (p) { if (p && p.obra) abrirObra(p.obra); else vObras(); };
  if (window.google && google.script && google.script.url) google.script.url.getLocation(function (l) { ini(l.parameter); });
  else ini(window.SIS_PARAM || {});
})();
